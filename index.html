// Constrói artIndex (Map<numId,{v,r,l}>) e subDevIndex (Map<artId,dispositivos[]>)
function _buildIndices(ds) {

// Extrai remissões internas e externas do texto de um dispositivo
function _extractRefs(text) {

function parse(txt){const ds=[];let a=null,ag=false;const reAltera=/\[?\s*(Reda[çc][ãa]o dada pel[oa]\(a\)[^\]]*|Inclu[ií]d[oa]\(a\) pel[oa]\(a\)[^\]]*|Revogad[oa]\(a\) pel[oa]\(a\)[^\]]*)\]?/gi;const reVetado=/\(\s*(?:VETADO|Vetado|vetado)\s*\)/;const reRevogado=/\(\s*(?:REVOGADO|Revogado|revogado)\s*\)/;

function extrairRemissoes(ds){const re=/(?:§\s*\d+[ºo°]?\s+d[oe]\s+)?(?:arts?\.\s*)(\d+[ºo°]?(?:\s*(?:,|e|a)\s*\d+[ºo°]?)*)/gi;const res=[];let art="";

function buildIdx(ds,area){const ws=AREAS[area]?.palavras||[];const idx={};let art="";for(const d of ds){if(d.tipo==="ARTIGO")art=d.id;const t=(d.txt+" "+d.rub).toLowerCase();for(const w of ws)if(t.includes(w.toLowerCase())&&art){if(!idx[w])idx[w]=[];if(!idx[w].includes(art))idx[w].push(art);}}return Object.fromEntries(Object.entries(idx).sort((a,b)=>a[0].localeCompare(b[0],"pt")));}

function fullTextSearch(ds,termo){
  if(!termo||termo.length<3)return[];
  const t=termo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const resultados=[];let artAtual="";
  for(let i=0;i<ds.length;i++){const d=ds[i];
    if(d.tipo==="ARTIGO")artAtual=d.id;
    const texto=((d.id||"")+" "+(d.rub||"")+" "+(d.txt||"")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(texto.includes(t)){
      const ocorrencias=(texto.split(t).length-1);
      resultados.push({idx:i,tipo:d.tipo,id:d.id,art:artAtual,txt:d.txt,rub:d.rub,ocorrencias,status:d.status||"vigente"});
    }
  }
  return resultados;
}

function hierarquia(ds){const ctx={};const trilha={PARTE:"",LIVRO:"",TÍTULO:"",CAPÍTULO:"",SEÇÃO:"",SUBSEÇÃO:""};const niv=["PARTE","LIVRO","TÍTULO","CAPÍTULO","SEÇÃO","SUBSEÇÃO"];
  for(const d of ds){if(DIV.has(d.tipo)){trilha[d.tipo]=d.rub||d.id;const i=niv.indexOf(d.tipo);for(let j=i+1;j<niv.length;j++)trilha[niv[j]]="";}
    if(d.tipo==="ARTIGO")ctx[d.id]=Object.values(trilha).filter(Boolean).join(" > ");}return ctx;}

async function pdfToText(f){const ab=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:ab}).promise;let fullText="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
    const items=c.items.filter(x=>x.str.trim()).sort((a,b)=>{const dy=b.transform[5]-a.transform[5];return Math.abs(dy)>3?dy:a.transform[4]-b.transform[4];});
    let lastY=null;let line="";
    for(const item of items){const y=Math.round(item.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>3){fullText+=line.trim()+"\n";line="";}
      line+=(line?" ":"")+item.str;lastY=y;}
    if(line.trim())fullText+=line.trim()+"\n";}
  fullText=fullText.replace(/([.;:)\]]) *(§\s*\d)/g,"$1\n$2");
  fullText=fullText.replace(/([.;:)\]]) *(Parágrafo único)/gi,"$1\n$2");
  fullText=fullText.replace(/ (TÍTULO\s+[IVXLCDM])/g,"\n$1");
  fullText=fullText.replace(/ (CAPÍTULO\s+[IVXLCDM])/g,"\n$1");
  fullText=fullText.replace(/ (Seção\s+[IVXLCDM])/gi,"\n$1");
  fullText=fullText.replace(/ (Subseção\s+[IVXLCDM])/gi,"\n$1");
  fullText=fullText.replace(/ (PARTE\s+(?:GERAL|ESPECIAL|[IVXLCDM]))/g,"\n$1");
  fullText=fullText.replace(/ (LIVRO\s+[IVXLCDM])/g,"\n$1");
  fullText=fullText.replace(/\s*(?:\u0000|\ufffd)?\s*ANEXO\s+[IVXLCDM]+\.pdf/gi,"");
  fullText=fullText.replace(/ANEXO\s+[IVXLCDM]+\.pdf/gi,"");
  fullText=fullText.replace(/\* Este texto não substitui o publicado oficialmente\./gi,"");
  return fullText;}
// ─── Storage Module — KV cache + async sync ───────────────────────────────────
const PROXY="https://tera-proxy.naytributos.workers.dev";
let _authToken=null;
const _cache={};

function LS(k,v){
  if(v===undefined){return _cache[k]!==undefined?_cache[k]:null;}
  if(v===null){
    delete _cache[k];
    if(_authToken)fetch(`${PROXY}/kv/${encodeURIComponent(k)}`,{method:"DELETE",headers:{Authorization:`Bearer ${_authToken}`}}).catch(()=>{});
    return;
  }
  _cache[k]=v;
  if(_authToken)fetch(`${PROXY}/kv/${encodeURIComponent(k)}`,{method:"PUT",headers:{Authorization:`Bearer ${_authToken}`,"Content-Type":"application/json"},body:JSON.stringify({value:JSON.stringify(v)})}).catch(()=>{});
}

async function storageInit(token){
  _authToken=token;
  sessionStorage.setItem("t3-token",token);
  try{
    const r=await fetch(`${PROXY}/kv-list`,{headers:{Authorization:`Bearer ${token}`}});
    if(!r.ok)return;
    const {keys}=await r.json();
    await Promise.all((keys||[]).map(async key=>{
      try{
        const r2=await fetch(`${PROXY}/kv/${encodeURIComponent(key)}`,{headers:{Authorization:`Bearer ${token}`}});
        const d=await r2.json();
        if(d.value!==null&&d.value!==undefined){try{_cache[key]=JSON.parse(d.value);}catch{_cache[key]=d.value;}}
      }catch{}
    }));
  }catch(e){console.warn("storageInit:",e);}
}

async function saveUserApiKey(key){
  if(!_authToken)return{ok:false,error:"Não autenticado"};
  const r=await fetch(`${PROXY}/user/apikey`,{method:"PUT",headers:{Authorization:`Bearer ${_authToken}`,"Content-Type":"application/json"},body:JSON.stringify({apiKey:key})});
  return r.json();
}

async function deleteUserApiKey(){
  if(!_authToken)return{ok:false};
  const r=await fetch(`${PROXY}/user/apikey`,{method:"DELETE",headers:{Authorization:`Bearer ${_authToken}`}});
  return r.json();
}

async function getUserApiKeyStatus(){
  if(!_authToken)return{configured:false};
  try{const r=await fetch(`${PROXY}/user/apikey`,{headers:{Authorization:`Bearer ${_authToken}`}});return r.json();}catch{return{configured:false};}
}

function storageLogout(){
  _authToken=null;
  sessionStorage.removeItem("t3-token");
  Object.keys(_cache).forEach(k=>delete _cache[k]);
}

async function callAI(body){
  return fetch(`${PROXY}/api/anthropic`,{method:"POST",headers:{Authorization:`Bearer ${_authToken}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
}

class ErrorBoundary extends React.Component{constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,errorInfo){console.error("Erro capturado:",error,errorInfo);}
  render(){if(this.state.hasError){return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}><div style={{maxWidth:500,textAlign:"center"}}><div style={{fontSize:32,marginBottom:16}}>⚠️</div><h1 style={{fontSize:24,fontWeight:700,marginBottom:12,color:"var(--text)"}}>Erro na Renderização</h1><p style={{fontSize:14,color:"var(--text-sec)",marginBottom:16,lineHeight:1.6}}>Ocorreu um erro ao carregar a aplicação. Por favor, recarregue a página.</p><details style={{marginTop:16,padding:12,background:"var(--bg-hover)",borderRadius:8,textAlign:"left",fontSize:12}}><summary style={{cursor:"pointer",fontWeight:600,marginBottom:8}}>Detalhes do Erro</summary><pre style={{overflow:"auto",padding:8,background:"var(--bg-card)",borderRadius:4,fontSize:11}}>{this.state.error?.toString()}</pre></details><button onClick={()=>window.location.reload()} style={{marginTop:16,padding:"10px 20px",background:"var(--grad)",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:600}}>Recarregar Página</button></div></div>;}return this.props.children;}}

// ═══ APP ═══
function App(){
  // ── Todos os hooks PRIMEIRO (regra do React) ────────────────────────────────
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("t3-theme")||"dark"}catch{return"dark"}});
  const [auth,setAuth]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [lib,setLib]=useState([]);
  const [sel,setSel]=useState(null);
  const [vw,setVw]=useState("library");
  const [uping,setUp]=useState(false);
  const [area,setArea]=useState("tributario");
  const [study,setStudy]=useState({});
  const [showApiKeyModal,setShowApiKeyModal]=useState(false);
  const [apiKeyStatus,setApiKeyStatus]=useState(null);
  const fRef=useRef(null);

  // ── Effects ─────────────────────────────────────────────────────────────────
  useEffect(()=>{document.body.setAttribute("data-theme",theme);try{localStorage.setItem("t3-theme",theme)}catch{}},[theme]);

  useEffect(()=>{
    const token=sessionStorage.getItem("t3-token");
    if(!token){setAuthLoading(false);return;}
    fetch(`${PROXY}/auth/me`,{headers:{Authorization:`Bearer ${token}`}})
      .then(r=>r.ok?r.json():null)
      .then(async d=>{
        if(d&&d.userId){
          await storageInit(token);
          setLib(LS("t3-lib")||[]);
          setStudy(LS("t3-st")||{});
          setAuth({token,username:d.username,userId:d.userId});
        }
        setAuthLoading(false);
      })
      .catch(()=>setAuthLoading(false));
  },[]);

  useEffect(()=>{
    if(!auth)return;
    getUserApiKeyStatus().then(s=>setApiKeyStatus(s));
  },[auth]);

  // ── Handlers ────────────────────────────────────────────────────────────────
  const toggleTheme=()=>setTheme(t=>t==="dark"?"light":"dark");

  const handleLogin=async(token,username,userId)=>{
    await storageInit(token);
    setLib(LS("t3-lib")||[]);
    setStudy(LS("t3-st")||{});
    setAuth({token,username,userId});
  };

  const handleLogout=async()=>{
    try{await fetch(`${PROXY}/auth/logout`,{method:"POST",headers:{Authorization:`Bearer ${auth.token}`}});}catch{}
    storageLogout();
    setLib([]);setStudy({});setSel(null);setVw("library");
    setAuth(null);
  };

  // ── Returns condicionais (APÓS todos os hooks) ───────────────────────────────
  if(authLoading)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}><Sp/><span style={{marginLeft:10,color:"var(--text-sec)"}}>Carregando…</span></div>;
  if(!auth)return <LoginScreen onLogin={handleLogin} theme={theme} toggleTheme={toggleTheme}/>;

  const upF=async e=>{const f=e.target.files?.[0];if(!f)return;setUp(true);try{const t=await pdfToText(f);const ds=parse(t);const l={id:Date.now()+"",nome:f.name.replace(/\.pdf$/i,""),data:new Date().toLocaleDateString("pt-BR"),ds,nA:ds.filter(d=>d.tipo==="ARTIGO").length,nD:ds.length,area,anexos:[]};const nl=[l,...lib];setLib(nl);LS("t3-lib",nl);setSel(l);setVw("reader");}catch(e){alert("Erro: "+e.message);}setUp(false);if(fRef.current)fRef.current.value="";};
  const del=id=>{const nl=lib.filter(l=>l.id!==id);setLib(nl);LS("t3-lib",nl);if(sel?.id===id){setSel(null);setVw("library");}};
  const addAnexo=async(leiId,file)=>{try{const t=await pdfToText(file);let ds=parse(t);
    if(ds.length<3){const lines=t.split("\n").map(l=>l.trim()).filter(Boolean);ds=lines.map(l=>({tipo:"TEXTO",id:"",rub:"",txt:l}));}
    const anx={nome:file.name.replace(/\.pdf$/i,""),data:new Date().toLocaleDateString("pt-BR"),ds,nD:ds.length};
    const nl=lib.map(l=>l.id===leiId?{...l,anexos:[...(l.anexos||[]),anx]}:l);setLib(nl);LS("t3-lib",nl);if(sel?.id===leiId)setSel(nl.find(l=>l.id===leiId));return true;}catch(e){alert("Erro no anexo: "+e.message);return false;}};
  const delAnexo=(leiId,idx)=>{const nl=lib.map(l=>l.id===leiId?{...l,anexos:(l.anexos||[]).filter((_,i)=>i!==idx)}:l);setLib(nl);LS("t3-lib",nl);if(sel?.id===leiId)setSel(nl.find(l=>l.id===leiId));};
  const uSt=(lid,di,f,v)=>{const k=`${lid}-${di}`;const n={...study,[k]:{...study[k],[f]:v}};setStudy(n);LS("t3-st",n);};
  const gSt=(lid,di,f)=>study[`${lid}-${di}`]?.[f]||"";
  const exportBackup=()=>{try{const data={lib,study,area,notas:LS("t3-notas"),temas:LS("t3-temas"),exportDate:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="TERA_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);}catch(e){alert("Erro ao exportar: "+e.message);}};
  const importBackup=()=>{const inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const txt=await f.text();const data=JSON.parse(txt);if(data.lib){setLib(data.lib);LS("t3-lib",data.lib);}if(data.study){setStudy(data.study);LS("t3-st",data.study);}if(data.notas)LS("t3-notas",data.notas);if(data.temas)LS("t3-temas",data.temas);alert("Backup restaurado com sucesso! "+((data.lib||[]).length)+" leis, "+(Object.keys(data.study||{}).length)+" anotações de estudo e "+((data.notas||[]).length)+" anotações do E-Consultor importadas.");}catch(e){alert("Erro ao importar: "+e.message);}};inp.click();};
  const nav=[{id:"library",ic:IC.bk,lb:"Biblioteca"},...(sel?[{id:"reader",ic:IC.ls,lb:sel.nome.slice(0,20)}]:[]),{id:"econsultor",ic:IC.br,lb:"E-Consultor"},{id:"reforma",ic:IC.sc,lb:"Reforma"},{id:"atualizacoes",ic:IC.bl,lb:"Atualizações"}];

  return <div style={{minHeight:"100vh"}}>
    <header style={{background:"var(--bg-card)",borderBottom:"1px solid var(--border)",padding:"8px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"var(--shadow)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <Logo/>
        <div><div style={{fontSize:15,fontWeight:700,letterSpacing:"1px"}}>TERA</div><div style={{fontSize:11,color:"var(--text-sec)"}}>RACIOCÍNIO JURÍDICO</div></div>
      </div>
      <nav style={{display:"flex",gap:2,overflowX:"auto"}}>{nav.map(n=><button key={n.id} className={`nb ${vw===n.id?"on":""}`} onClick={()=>setVw(n.id)}><Ic d={n.ic} s={14} c={vw===n.id?"var(--gold)":"var(--text-sec)"}/>{n.lb}</button>)}</nav>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <ThemeBtn theme={theme} toggle={toggleTheme}/>
        <button onClick={exportBackup} title="Exportar Backup (Leis + Anotações)" style={{fontSize:11,color:"var(--text-sec)",padding:"5px 8px",border:"1px solid var(--border)",borderRadius:5,background:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}><Ic d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" s={11} c="var(--text-sec)"/>Backup</button>
        <button onClick={importBackup} title="Importar Backup" style={{fontSize:11,color:"var(--text-sec)",padding:"5px 8px",border:"1px solid var(--border)",borderRadius:5,background:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}><Ic d={IC.up} s={11} c="var(--text-sec)"/>Restaurar</button>
        <button onClick={()=>setShowApiKeyModal(true)} title="Configurar API Key Anthropic" style={{fontSize:11,color:apiKeyStatus?.configured?"var(--ok)":"var(--err)",padding:"5px 8px",border:"1px solid var(--border)",borderRadius:5,background:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}><Ic d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 14.2a7.2 7.2 0 0 1-6-3.22c.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08a7.2 7.2 0 0 1-6 3.22z" s={11} c={apiKeyStatus?.configured?"var(--ok)":"var(--err)"}/>API Key</button>
        <button onClick={handleLogout} title="Sair" style={{fontSize:11,color:"var(--text-sec)",padding:"5px 8px",border:"1px solid var(--border)",borderRadius:5,background:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}><Ic d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" s={11} c="var(--text-sec)"/>{auth.username}</button>
        <select value={area} onChange={e=>setArea(e.target.value)} style={{background:"var(--input-bg)",border:"1px solid var(--border)",borderRadius:5,color:"var(--text)",padding:"5px 8px",fontSize:11}}>{Object.entries(AREAS).map(([k,v])=><option key={k} value={k}>{v.nome}</option>)}</select>
      </div>
    </header>
    <main style={{maxWidth:1440,margin:"0 auto",padding:"20px"}}>
      {vw==="library"&&<Lib lib={lib} sel={sel} onSel={l=>{setSel(l);setVw("reader");}} onDel={del} onUp={upF} uping={uping} fRef={fRef}/>}
      {vw==="reader"&&sel&&<Reader lei={sel} area={area} gSt={gSt} uSt={uSt} addAnexo={addAnexo} delAnexo={delAnexo} study={study}/>}
      {vw==="econsultor"&&<EConsultor lib={lib}/>}
      {vw==="reforma"&&<Ref/>}
      {vw==="atualizacoes"&&<Atl/>}
    </main>
    {showApiKeyModal&&<ApiKeyModal
      status={apiKeyStatus}
      onSave={async(k)=>{
        const r=await saveUserApiKey(k);
        if(r.ok){setApiKeyStatus({configured:true,masked:r.masked});setShowApiKeyModal(false);}
        else alert(r.error||"Erro ao salvar chave");
      }}
      onDelete={async()=>{
        await deleteUserApiKey();
        setApiKeyStatus({configured:false});
        setShowApiKeyModal(false);
      }}
      onClose={()=>setShowApiKeyModal(false)}
    />}
  </div>;
}

  </div>
  {lib.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:10}}>{lib.map(l=><div key={l.id} className="cd" style={{padding:14,cursor:"pointer",borderColor:sel?.id===l.id?"#B8965A":"#E8DFD0"}} onClick={()=>onSel(l)}>
    <div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{fontSize:14,fontWeight:600,marginBottom:4}}>{l.nome}</div><span className="tg" style={{background:"var(--gold-subtle)",color:"var(--gold)"}}>{AREAS[l.area]?.nome||l.area}</span></div>
    <button onClick={e=>{e.stopPropagation();onDel(l.id);}} style={{background:"none",border:"none",color:"var(--text-sec)",cursor:"pointer"}}><Ic d={IC.tr} s={13} c="#8A8279"/></button></div>
    <div style={{display:"flex",gap:10,marginTop:8,fontSize:11,color:"var(--text-sec)",fontFamily:"'Segoe UI',sans-serif"}}><span>{l.nA} artigos</span><span>{l.nD} dispositivos</span><span>{l.data}</span></div>
  </div>)}</div>}
</div>;}

// ═══ READER ═══
// ALTERAÇÕES ENTREGA 2:
// - Removida aba "remissoes" e "tutor" do array tabs
// - Renomeada "sabatina" → "Perguntas e Respostas"
// - Renomeada "indice" → "Busca"
// - Removidas as renderizações condicionais de tab==="remissoes" e tab==="tutor"
// - Export Excel: removida aba "Remissões"
function Reader({lei,area,gSt,uSt,addAnexo,delAnexo,study}){
  const [tab,setTab]=useState("texto");const [saved,setSaved]=useState(false);const [goSearch,setGoSearch]=useState("");
  const tabs=[{id:"sumario",lb:"Sumário"},{id:"texto",lb:"Texto Integral"},{id:"artigos",lb:"Artigos"},{id:"estudo",lb:"Estudo Guiado"},{id:"prazos",lb:"Prazos/Valores"},{id:"busca",lb:"Busca"},{id:"mapa",lb:"Mapa"},{id:"anexos",lb:`Anexos (${(lei.anexos||[]).length})`},{id:"teia",lb:"🕸 Teia"},{id:"perguntasrespostas",lb:"Perguntas e Respostas"}];
  const ds=lei.ds;
  const showSaved=()=>{setSaved(true);setTimeout(()=>setSaved(false),1500);};
  const wrappedUSt=(a,b,c,d)=>{uSt(a,b,c,d);showSaved();};

  // ═══ ÍNDICES PRÉ-CONSTRUÍDOS (Performance O(1)) ═══
  // Construídos uma única vez via useMemo, eliminando busca linear O(n) por lookup
  const artIndex = useMemo(() => {
    const idx = new Map(); // Map<numericId, {vigente, revogado, last}>
    for (const d of ds) {
      if (d.tipo !== "ARTIGO") continue;
      const numId = d.id.replace(/[^0-9]/g, "");
      if (!idx.has(numId)) idx.set(numId, { vigente: null, revogado: null, last: null });
      const entry = idx.get(numId);
      if (d.status === "vigente") entry.vigente = d;
      else if (d.status === "revogado") entry.revogado = d;
      entry.last = d;
    }
    return idx;
  }, [ds]);

  const subDevIndex = useMemo(() => {
    const idx = new Map(); // Map<artId, dispositivo[]>
    let currentArt = null;
    for (const d of ds) {
      if (d.tipo === "ARTIGO") { currentArt = d.id; continue; }
      if (DIV.has(d.tipo)) { currentArt = null; continue; }
      if (currentArt && d.status !== "vetado") {
        if (!idx.has(currentArt)) idx.set(currentArt, []);
        idx.get(currentArt).push(d);
      }
    }
    return idx;
  }, [ds]);

  // ENTREGA 3: retorna {internal: [...artIds], external: [...leiNames]}
  const extractRefsWithMetadata = (text) => {
    const internal = [];
    const external = [];
    const reArt = /arts?\.\s*(\d+[ºo°]?(?:\s*(?:,|e|a)\s*\d+[ºo°]?)*)/gi;
    const reLeiNome = /(?:Lei(?:\s+Complementar)?|Decreto(?:-Lei)?|Medida\s+Provis[óo]ria|Instru[çc][ãa]o\s+Normativa(?:\s+(?:RFB|SRF|[A-Z]{2,}))?|C[óo]digo\s+\w+)\s+n[ºo°]/i;
    const externalRanges = [];
    const reParen = /\([^)]+\)/g;
    let pm;
    while ((pm = reParen.exec(text)) !== null) {
      if (reLeiNome.test(pm[0])) {
        externalRanges.push([pm.index, pm.index + pm[0].length]);
      }
    }
    const reLeiInline = /(?:Lei(?:\s+Complementar)?\s+n[ºo°]?\s*[\d.]+|Decreto(?:-Lei)?\s+n[ºo°]?\s*[\d.]+|Medida\s+Provis[óo]ria\s+n[ºo°]?\s*[\d.]+|Instru[çc][ãa]o\s+Normativa\s+(?:RFB\s+|SRF\s+|[A-Z]{2,}\s+)?n[ºo°]?\s*[\d.]+)/gi;

    // Extrair TODAS as leis externas mencionadas no texto
    const reLeiCapture = /(?:Lei(?:\s+Complementar)?\s+n[ºo°]?\s*[\d.\/]+|Decreto(?:-Lei)?\s+n[ºo°]?\s*[\d.\/]+|Medida\s+Provis[óo]ria\s+n[ºo°]?\s*[\d.\/\-]+|Instru[çc][ãa]o\s+Normativa\s+(?:RFB\s+|SRF\s+|[A-Z]{2,}\s+)?n[ºo°]?\s*[\d.\/]+|C[óo]digo\s+(?:Tribut[áa]rio|Civil|Penal|de\s+Processo)\s+Nacional|Constitui[çc][ãa]o\s+Federal)/gi;
    let lm2;
    while ((lm2 = reLeiCapture.exec(text)) !== null) {
      const name = lm2[0].trim();
      if (!external.includes(name)) external.push(name);
    }

    const isCitationSyntaxOnly = (between) => {
      let cleaned = between;
      cleaned = cleaned.replace(/,?\s*de\s+\d{1,2}\s+de\s+\w+\s+de\s+\d{4}/g, "");
      cleaned = cleaned.replace(/,?\s*de\s+\d{4}/g, "");
      cleaned = cleaned.replace(/\s*arts?\.\s*\d+[ºo°]?/g, "");
      cleaned = cleaned.replace(/\s*§+\s*\d*[ºo°]?\.?/g, "");
      cleaned = cleaned.replace(/\s*incisos?\s+[IVXLCDM]+/gi, "");
      cleaned = cleaned.replace(/\s*al[íi]neas?\s+[a-z]\)?/gi, "");
      cleaned = cleaned.replace(/\s*itens?\s+\d+/gi, "");
      cleaned = cleaned.replace(/(?:Lei(?:\s+Complementar)?\s+n[ºo°]?\s*[\d.]+|Decreto(?:-Lei)?\s+n[ºo°]?\s*[\d.]+)/gi, "");
      cleaned = cleaned.replace(/[,;.\s\-–—ºo°:()]+/g, " ");
      cleaned = cleaned.replace(/\b(?:e|a|de|do|da|dos|das|no|na|nos|nas|ao|caput)\b/gi, "");
      cleaned = cleaned.trim();
      return cleaned.length === 0;
    };
    let m;
    while ((m = reArt.exec(text)) !== null) {
      const pos = m.index;
      const inExtParen = externalRanges.some(([s, e]) => pos >= s && pos <= e);
      if (inExtParen) continue;
      const before = text.slice(Math.max(0, pos - 250), pos);
      let isExternal = false;
      reLeiInline.lastIndex = 0;
      let lastLaw = null;
      let lm;
      while ((lm = reLeiInline.exec(before)) !== null) {
        lastLaw = { index: lm.index, end: lm.index + lm[0].length, text: lm[0] };
      }
      if (lastLaw) {
        const between = before.slice(lastLaw.end);
        if (isCitationSyntaxOnly(between)) {
          isExternal = true;
        }
      }
      if (isExternal) continue;
      const nums = m[1].match(/\d+[ºo°]?/g) || [];
      for (const n of nums) {
        const artId = "Art. " + n;
        if (!internal.includes(artId)) internal.push(artId);
      }
    }
    return { internal, external };
  };

  // Wrapper de compatibilidade para código existente que usa extractInternalRefs
  const extractInternalRefs = (text) => extractRefsWithMetadata(text).internal;

  // ENTREGA 3: findDevice agora usa artIndex — O(1) em vez de O(n)
  const findDevice = (artId) => {
    const cleanId = artId.replace(/^Art\.\s*/i, "").replace(/[^0-9]/g, "").trim();
    const entry = artIndex.get(cleanId);
    if (!entry) return null;
    return entry.vigente || entry.revogado || entry.last;
  };

  // ENTREGA 3: getSubDevices agora usa subDevIndex — O(1) em vez de O(n)
  const getSubDevices = (artId) => {
    return subDevIndex.get(artId) || [];
  };

  // visited COMPARTILHADO (não clonado por ramo) — evita explosão combinatorial.
  // Mesma lógica do worker. depth adicional como segurança.
  const _BRT_MAX_DEPTH = 8;
  const buildRecursiveTree = (startId, visited = new Set(), depth = 0) => {
    if (depth > _BRT_MAX_DEPTH) return null;
    if (visited.has(startId)) return null;
    visited.add(startId);
    const device = findDevice(startId);
    if (!device) return null;
    const isRevogado = device.status === "revogado";
    const subs = getSubDevices(device.id);
    const fullText = [device.txt || "", ...subs.map(s => (s.id || "") + " " + (s.txt || ""))].join(" ");
    const allRefs = isRevogado ? { internal: [], external: [] } : extractRefsWithMetadata(fullText);
    const selfNum = device.id.replace(/[^0-9]/g, "");
    const filteredRefs = allRefs.internal.filter(r => r.replace(/[^0-9]/g, "") !== selfNum);
    const children = [];
    for (const ref of filteredRefs) {
      const child = buildRecursiveTree(ref, visited, depth + 1);
      if (child) children.push(child);
    }
    return {
      id: device.id,
      text: (device.txt || "").trim(),
      status: device.status || "vigente",
      alteracao: device.alteracao || "",
      subs: subs.slice(0, 10),
      refs: filteredRefs,
      externalRefs: allRefs.external,
      children
    };
  };

  const buildRecursiveChain = (startId) => {
    const chain = [];
    const visited = new Set();
    let currentId = startId;
    while (currentId && !visited.has(currentId)) {
      visited.add(currentId);
      const device = findDevice(currentId);
      if (!device) break;
      const fullText = (device.rub || "") + " " + (device.txt || "");
      const refs = extractInternalRefs(fullText);
      const selfNum = device.id.replace(/[^0-9]/g, "");
      const filteredRefs = refs.filter(r => r.replace(/[^0-9]/g, "") !== selfNum);
      chain.push({ id: device.id, text: fullText.trim(), refs: filteredRefs });
      currentId = filteredRefs.length > 0 ? filteredRefs[0] : null;
    }
    return chain;
  };

  // ALTERAÇÃO ENTREGA 2: removida aba "Remissões" do export Excel
  const exportXlsx=()=>{try{const wb=XLSX.utils.book_new();
    const txData=[["#","Tipo","Identificador","Rubrica","Texto","Status Legal","Alteração"],...ds.map((d,i)=>[i+1,d.tipo,d.id,d.rub,d.txt,d.status||"vigente",d.alteracao||""])];
    const wsTx=XLSX.utils.aoa_to_sheet(txData);
    wsTx["!cols"]=[{wch:6},{wch:14},{wch:18},{wch:40},{wch:80},{wch:12},{wch:50}];
    XLSX.utils.book_append_sheet(wb,wsTx,"Texto Integral");
    const ctx=hierarquia(ds);let art="";const estData=[["Localização","Artigo","Dispositivo","Texto","Status Estudo","Dificuldade","Anotação","Status Legal"]];
    for(let i=0;i<ds.length;i++){const d=ds[i];if(d.tipo==="ARTIGO")art=d.id;if(!DIV.has(d.tipo))estData.push([ctx[art]||"",art,d.id,d.txt,gSt(lei.id,i,"status"),gSt(lei.id,i,"dif"),gSt(lei.id,i,"note"),d.status||"vigente"]);}
    const wsEst=XLSX.utils.aoa_to_sheet(estData);
    wsEst["!cols"]=[{wch:40},{wch:12},{wch:18},{wch:70},{wch:14},{wch:14},{wch:40},{wch:12}];
    XLSX.utils.book_append_sheet(wb,wsEst,"Estudo Guiado");
    const teiaData = [["Artigo Origem", "Caminho da Teia (Texto Integral)"]];
    const artigos = ds.filter(d => d.tipo === "ARTIGO");
    artigos.forEach(a => {
      const chain = buildRecursiveChain(a.id);
      if (chain.length > 1) {
        const pathText = chain.map(c => `[${c.id}]\n${c.text}`).join("\n\n↓\n\n");
        teiaData.push([a.id, pathText]);
      }
    });
    const wsTeia=XLSX.utils.aoa_to_sheet(teiaData);
    wsTeia["!cols"]=[{wch:16},{wch:100}];
    XLSX.utils.book_append_sheet(wb,wsTeia,"Teia de Remissões");
    const pv=extrairPrazosValores(ds);const pvData=[["#","Tipo","Conteúdo","Artigo","Capítulo","Contexto"],...pv.map((r,i)=>[i+1,r.tipo,r.val,r.art,r.cap,r.ctx])];
    const wsPv=XLSX.utils.aoa_to_sheet(pvData);
    wsPv["!cols"]=[{wch:6},{wch:18},{wch:22},{wch:12},{wch:35},{wch:80}];
    XLSX.utils.book_append_sheet(wb,wsPv,"Prazos e Valores");
    const idx=buildIdx(ds,area);const idxData=[["Palavra-chave","Artigos","Qtd"],...Object.entries(idx).map(([p,a])=>[p,a.join(", "),a.length])];
    const wsIdx=XLSX.utils.aoa_to_sheet(idxData);
    wsIdx["!cols"]=[{wch:25},{wch:80},{wch:8}];
    XLSX.utils.book_append_sheet(wb,wsIdx,"Índice Remissivo");
    XLSX.writeFile(wb,lei.nome+"_TERA.xlsx");}catch(e){alert("Erro ao exportar: "+e.message);}};

  return <div className="fade">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div><h2 style={{fontSize:17,fontWeight:700}}>{lei.nome}</h2><div style={{fontSize:12,color:"var(--text-sec)",fontFamily:"'Segoe UI',sans-serif"}}>{lei.nD} dispositivos · {lei.nA} artigos · {(lei.anexos||[]).length} anexos · {AREAS[area]?.nome}</div></div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        {saved&&<span style={{fontSize:12,color:"var(--ok)",fontWeight:600,animation:"fadeIn .2s"}}>Salvo!</span>}
        <button onClick={exportXlsx} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 14px",background:"var(--grad)",color:"#fff",border:"none",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer"}}>Exportar Excel</button>
      </div>
    </div>
    <div style={{display:"flex",gap:0,borderBottom:"1px solid var(--border)",marginBottom:14,overflowX:"auto"}}>{tabs.map(t=><button key={t.id} className={`stab ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>{t.lb}</button>)}</div>
    {tab==="sumario"&&<TabSumario ds={ds}/>}
    {tab==="texto"&&<TabTexto ds={ds} lei={lei} gSt={gSt} uSt={wrappedUSt}/>}
    {tab==="artigos"&&<TabArtigos ds={ds}/>}
    {tab==="estudo"&&<TabEstudo ds={ds} lei={lei} gSt={gSt} uSt={wrappedUSt}/>}
    {tab==="prazos"&&<TabPrazos ds={ds}/>}
    {tab==="busca"&&<TabIndice ds={ds} area={area} onGoToArt={a=>{setGoSearch(a);setTab("texto");}}/>}
    {tab==="mapa"&&<TabMapa ds={ds}/>}
    {tab==="anexos"&&<TabAnexos lei={lei} addAnexo={addAnexo} delAnexo={delAnexo}/>}
    {tab==="teia"&&<TabTeia ds={ds} buildRecursiveTree={buildRecursiveTree} buildRecursiveChain={buildRecursiveChain}/>}
    {tab==="perguntasrespostas"&&<TabSabatina lei={lei} area={area}/>}
  </div>;
}

function TabSumario({ds}){const items=ds.filter(d=>DIV.has(d.tipo));return <div style={{maxHeight:"70vh",overflow:"auto"}}><table className="dt"><thead><tr><th>#</th><th>Tipo</th><th>Identificador</th><th>Rubrica</th></tr></thead><tbody>{items.map((d,i)=><tr key={i} style={{background:CT[d.tipo]||"#fff",color:d.tipo==="PARTE"||d.tipo==="LIVRO"||d.tipo==="TÍTULO"||d.tipo==="CAPÍTULO"?"#fff":"#2D2A26"}}><td>{i+1}</td><td><span className="badge" style={{background:"rgba(0,0,0,.15)",color:"inherit"}}>{d.tipo}</span></td><td style={{fontWeight:700}}>{d.id}</td><td>{d.rub}</td></tr>)}</tbody></table></div>;}

// ALTERAÇÃO ENTREGA 2: removida barra de busca do Texto Integral
function TabTexto({ds,lei,gSt,uSt}){
  const ind={PARTE:0,LIVRO:0,TÍTULO:0,CAPÍTULO:12,SEÇÃO:24,SUBSEÇÃO:36,ARTIGO:0,PARÁGRAFO:20,INCISO:36,ALÍNEA:52,ITEM:68};
  const sts=["","Não lido","Lido","Revisando","Dominado","Dúvida"];const sC={Dominado:"#27AE60",Dúvida:"#C0392B",Revisando:"#D4A017",Lido:"#2E86AB"};
  return <div>
    <div style={{maxHeight:"68vh",overflow:"auto",border:"1px solid var(--border)",borderRadius:8}}>{ds.map((d,i)=>{const ri=i;const isD=DIV.has(d.tipo);const st=gSt(lei.id,ri,"status");const nt=gSt(lei.id,ri,"note");const isVetado=d.status==="vetado";const isRevogado=d.status==="revogado";
      return <div key={ri} style={{display:"flex",borderBottom:"1px solid var(--border)",background:isVetado?"rgba(231,76,60,0.06)":isRevogado?"rgba(231,76,60,0.04)":isD?CT[d.tipo]||"#F5EDDF":ri%2===0?"#fff":"#FAF7F2",paddingLeft:ind[d.tipo]||0}}>
        <div style={{minWidth:70,padding:"6px 4px",textAlign:"center"}}>
          <span className="badge" style={{background:isD?"rgba(0,0,0,.1)":"#F3EDE4",color:isD?(d.tipo==="PARTE"||d.tipo==="LIVRO"||d.tipo==="TÍTULO"||d.tipo==="CAPÍTULO"?"#fff":"#5C554A"):"#8A8279"}}>{d.tipo}</span>
          {isVetado&&<div><span className="badge badge-revogado" style={{marginTop:3,display:"inline-block"}}>VETADO</span></div>}
          {isRevogado&&<div><span className="badge badge-revogado" style={{marginTop:3,display:"inline-block"}}>REVOGADO</span></div>}
        </div>
        <div style={{flex:1,padding:"6px 8px",fontSize:12.5,lineHeight:1.6,color:isD?(d.tipo==="PARTE"||d.tipo==="LIVRO"||d.tipo==="TÍTULO"?"#fff":"#2D2A26"):"#2D2A26",fontWeight:isD||d.tipo==="ARTIGO"?600:400,textDecoration:(isVetado||isRevogado)?"line-through":"none",opacity:(isVetado||isRevogado)?0.6:1}}>
          <span style={{color:isD?"inherit":"#B8965A",fontFamily:"'Segoe UI',sans-serif",fontSize:12,marginRight:4,textDecoration:"none"}}>{d.id}</span>
          {d.rub&&<i style={{opacity:.7}}>{d.rub} </i>}{d.txt}
          {d.alteracao&&<div style={{marginTop:3,padding:"2px 8px",background:"rgba(52,152,219,0.08)",borderLeft:"2px solid #3498db",borderRadius:3,fontSize:11,color:"#3498db",textDecoration:"none",fontWeight:400,opacity:1}}>↳ {d.alteracao}</div>}
          {nt&&<div style={{marginTop:3,padding:"2px 6px",background:"var(--gold-subtle)",borderLeft:"2px solid #B8965A",borderRadius:3,fontSize:11,color:"var(--gold)",textDecoration:"none",fontWeight:400,opacity:1}}>{nt}</div>}
        </div>
        {!isD&&<div style={{minWidth:100,padding:"5px 4px",display:"flex",flexDirection:"column",gap:3}}>
          <select value={st} onChange={e=>uSt(lei.id,ri,"status",e.target.value)} style={{background:"var(--bg-hover)",border:"1px solid var(--border)",borderRadius:3,color:sC[st]||"#8A8279",padding:"2px",fontSize:11,cursor:"pointer"}}>{sts.map(s=><option key={s} value={s}>{s||"Status"}</option>)}</select>
          <textarea placeholder="Anotação..." defaultValue={nt} onBlur={e=>uSt(lei.id,ri,"note",e.target.value)} style={{background:"var(--input-bg)",border:"1px solid var(--border)",borderRadius:4,padding:"4px 6px",fontSize:12,width:"100%",minHeight:50,maxHeight:150,resize:"vertical",fontFamily:"inherit"}}/>
        </div>}
      </div>;})}</div></div>;
}

function TabArtigos({ds}){let art="";const rows=[];const tipos=new Set(["ARTIGO","PARÁGRAFO","INCISO","ALÍNEA","ITEM"]);
  for(const d of ds){if(d.tipo==="ARTIGO")art=d.id;if(tipos.has(d.tipo))rows.push({art,tipo:d.tipo,id:d.id,rub:d.rub,txt:d.txt,status:d.status||"vigente",alteracao:d.alteracao||""});}
  return <div style={{maxHeight:"70vh",overflow:"auto"}}><table className="dt"><thead><tr><th>Artigo</th><th>Tipo</th><th>Identificador</th><th>Status</th><th>Texto</th><th>Alteração</th></tr></thead><tbody>{rows.map((r,i)=><tr key={i} style={{opacity:r.status==="vetado"||r.status==="revogado"?0.5:1}}><td style={{fontWeight:700,color:"var(--gold)"}}>{r.art}</td><td><span className="badge" style={{background:"var(--gold-subtle)",color:"var(--gold)"}}>{r.tipo}</span></td><td style={{fontSize:12}}>{r.id}</td><td>{r.status==="vetado"?<span className="badge badge-revogado">VETADO</span>:r.status==="revogado"?<span className="badge badge-revogado">REVOGADO</span>:<span className="badge badge-vigente">VIGENTE</span>}</td><td style={{fontSize:12,textDecoration:r.status!=="vigente"?"line-through":"none"}}>{r.txt}</td><td style={{fontSize:11,color:"var(--text-sec)"}}>{r.alteracao}</td></tr>)}</tbody></table></div>;}

function TabEstudo({ds,lei,gSt,uSt}){
  const [filtroStatus,setFiltroStatus]=useState("");
  const [selSection,setSelSection]=useState(null); // nó hierárquico selecionado para filtrar
  const [collNav,setCollNav]=useState({});         // estado colapso da nav hierárquica
  const sts=["Não lido","Lido","Revisando","Dominado","Dúvida"];
  const sC={Dominado:"#27AE60",Dúvida:"#C0392B",Revisando:"#D4A017",Lido:"#2E86AB"};

  // ── Estrutura hierárquica (igual ao TabMapa, sem artigos) ──────────────────
  const estrutura = useMemo(()=>{
    const mapa=[];
    const stack={PARTE:null,LIVRO:null,"TÍTULO":null,"CAPÍTULO":null,"SEÇÃO":null,"SUBSEÇÃO":null};
    const levels=["PARTE","LIVRO","TÍTULO","CAPÍTULO","SEÇÃO","SUBSEÇÃO"];
    const clearBelow=(tipo)=>{const idx=levels.indexOf(tipo);for(let i=idx+1;i<levels.length;i++)stack[levels[i]]=null;};
    const getParent=(tipo)=>{const idx=levels.indexOf(tipo);for(let i=idx-1;i>=0;i--){if(stack[levels[i]])return stack[levels[i]];}return null;};
    for(const d of ds){
      if(DIV.has(d.tipo)){
        const node={tipo:d.tipo,id:d.id,rub:d.rub,dsStart:null,dsEnd:null,children:[]};
        clearBelow(d.tipo);stack[d.tipo]=node;
        const parent=getParent(d.tipo);
        if(parent)parent.children.push(node);else mapa.push(node);
      }
    }
    // Computa dsStart/dsEnd de cada nó para filtrar a tabela
    const computeRange=(nodes)=>{
      for(const n of nodes){
        const startIdx=ds.findIndex(d=>d.tipo===n.tipo&&d.id===n.id);
        n.dsStart=startIdx;
        let endIdx=ds.length;
        const myLevel=levels.indexOf(n.tipo);
        for(let i=startIdx+1;i<ds.length;i++){
          if(DIV.has(ds[i].tipo)&&levels.indexOf(ds[i].tipo)<=myLevel){endIdx=i;break;}
        }
        n.dsEnd=endIdx;
        computeRange(n.children);
      }
    };
    computeRange(mapa);
    return mapa;
  },[ds]);

  // Inicializa nav recolhida
  const navRef=useRef(null);
  if(estrutura!==navRef.current){
    navRef.current=estrutura;
    const allK={};
    const mark=(ns,prefix)=>ns.forEach((n,i)=>{const k=prefix+"-"+n.id;if(n.children?.length>0)allK[k]=true;mark(n.children,k+"-"+i);});
    mark(estrutura,"enav");
    if(Object.keys(allK).length>0&&Object.keys(collNav).length===0)
      setTimeout(()=>setCollNav(allK),0);

  const allNavKeysRef=useRef({});

    estNavRef.current=estrutura;
    const allK={};
    const mark=(ns,prefix)=>ns.forEach((n,i)=>{const k=prefix+"-"+n.id;if(n.children?.length>0)allK[k]=true;mark(n.children,k+"-"+i);});

  const toggleNav=(key)=>{
    setCollNav(p=>{

  const fd = useMemo(()=>{

  const renderNavNode=(node,depth,pathKey)=>{

// Recebe o tree retornado pelo worker e renderiza no <svg> via D3 v7.
// Nós recolhidos automaticamente a partir de depth >= 2 para não sobrecarregar o canvas.
function renderD3Tree(data, svgEl, onSelect) {
  if (!window.d3 || !svgEl || !data) return;
  const d3 = window.d3;
  const cs = v => getComputedStyle(document.body).getPropertyValue(v).trim();
  const C  = {
    gold   : cs("--gold"),
    goldB  : cs("--gold-bright"),
    border : cs("--border"),
    text   : cs("--text"),
    sec    : cs("--text-sec"),
    err    : "#e74c3c",
    ext    : "#3498db",
  };
  const W = svgEl.clientWidth  || 900;
  const H = svgEl.clientHeight || 500;

  d3.select(svgEl).selectAll("*").remove();
  const svg = d3.select(svgEl);

  // Defs: arrowhead
  const defs = svg.append("defs");
  defs.append("marker")
    .attr("id","teia-arrow")
    .attr("viewBox","0 -5 10 10")
    .attr("refX",26).attr("refY",0)
    .attr("markerWidth",6).attr("markerHeight",6)
    .attr("orient","auto")
    .append("path").attr("d","M0,-5L10,0L0,5").attr("fill",C.border);

  // Drop-shadow filter
  const filt = defs.append("filter").attr("id","teia-shadow").attr("x","-20%").attr("y","-20%").attr("width","140%").attr("height","140%");
  filt.append("feDropShadow").attr("dx",0).attr("dy",2).attr("stdDeviation",3).attr("flood-color","rgba(0,0,0,0.25)");

  const g = svg.append("g");

  const zoom = d3.zoom().scaleExtent([0.08, 4])
    .on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  // Build hierarchy; collapse depth >= 2 on first render
  const root = d3.hierarchy(data);
  root.eachBefore(d => {
    if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
  });

  const layout = d3.tree().nodeSize([56, 300]);

  const nodeLabel = d => d.data.id.replace(/^Art\.\s*/i,"").replace(/[ºo°]/g,"").trim().slice(0,6);
  const isRev     = d => d.data.status === "revogado";
  const hasHidden = d => !!(d._children && d._children.length);
  const nodeColor = d => isRev(d) ? C.err : hasHidden(d) ? C.goldB : C.gold;

  function draw() {
    layout(root);
    const nodes = root.descendants();
    const links = root.links();

    // ── Links ──────────────────────────────────────────────────────────────────
    g.selectAll(".t-link").remove();
    g.selectAll(".t-link").data(links).enter().append("path")
      .attr("class","t-link")
      .attr("fill","none")
      .attr("stroke", C.border)
      .attr("stroke-width", 1.5)
      .attr("stroke-opacity", 0.65)
      .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

    // ── Nodes ──────────────────────────────────────────────────────────────────
    g.selectAll(".t-node").remove();
    const node = g.selectAll(".t-node").data(nodes).enter().append("g")
      .attr("class","t-node")
      .attr("transform", d => "translate("+d.y+","+d.x+")")
      .style("cursor","pointer")
      .on("click", function(ev, d) {
        ev.stopPropagation();
        if (d.children)  { d._children = d.children;  d.children  = null; }
        else if (d._children) { d.children = d._children; d._children = null; }
        onSelect(d.data);
        draw();
      });

    // Main circle
    node.append("circle")
      .attr("r", 20)
      .attr("fill", nodeColor)
      .attr("fill-opacity", d => isRev(d) ? 0.7 : 1)
      .attr("stroke", "rgba(255,255,255,0.2)")
      .attr("stroke-width", 2)
      .attr("filter", "url(#teia-shadow)");

    // Hover ring
    node.append("circle")
      .attr("r", 20)
      .attr("fill", "transparent")
      .attr("stroke", "rgba(255,255,255,0)")
      .attr("stroke-width", 3)
      .on("mouseover", function() { d3.select(this).attr("stroke","rgba(255,255,255,0.4)"); })
      .on("mouseout",  function() { d3.select(this).attr("stroke","rgba(255,255,255,0)"); });

    // Article number label inside circle
    node.append("text")
      .attr("text-anchor","middle")
      .attr("dominant-baseline","central")
      .attr("fill","#fff")
      .attr("font-size","10px")
      .attr("font-weight","700")
      .attr("pointer-events","none")
      .text(nodeLabel);

    // Collapsed children badge  (+N)
    node.filter(d => hasHidden(d)).append("text")
      .attr("x", 22).attr("y",-18)
      .attr("fill", C.goldB)
      .attr("font-size","9px").attr("font-weight","700")
      .text(d => "+"+d._children.length);

    // External-refs dot (blue, top-left of circle)
    node.filter(d => d.data.externalRefs && d.data.externalRefs.length > 0)
      .append("circle")
      .attr("cx",-16).attr("cy",-16).attr("r",5)
      .attr("fill", C.ext)
      .attr("stroke","rgba(255,255,255,0.5)").attr("stroke-width",1.5);

    // Children count label to the right of node (when expanded)
    node.filter(d => d.children && d.children.length > 0).append("text")
      .attr("x", 24).attr("y", 4)
      .attr("fill", C.sec).attr("font-size","9px")
      .text(d => d.children.length+" >");
  }

  // Compute initial center before first draw
  layout(root);
  const xs  = root.descendants().map(d => d.x);
  const mid = (Math.min(...xs) + Math.max(...xs)) / 2;
  svg.call(zoom.transform, d3.zoomIdentity.translate(90, H / 2 - mid));

  draw();
}

function TabTeia({ds, buildRecursiveTree, buildRecursiveChain}){
  const [startArt,  setStartArt]  = useState("");
  const [tree,      setTree]      = useState(null);
  const [traced,    setTraced]    = useState(false);
  const [loading,   setLoading]   = useState(false);
  const [selNode,   setSelNode]   = useState(null);   // nó selecionado → painel de detalhes
  const workerRef = useRef(null);
  const svgRef    = useRef(null);

  const arts = useMemo(
    () => ds.filter(d => d.tipo === "ARTIGO" && d.status !== "vetado").map(d => d.id),
    [ds]
  );

  // Termina worker ao desmontar
  useEffect(() => {
    return () => { if (workerRef.current) { workerRef.current.terminate(); workerRef.current = null; } };
  }, []);

  // Renderiza/re-renderiza D3 sempre que tree mudar
  useEffect(() => {
    if (!tree || !svgRef.current) return;
    renderD3Tree(tree, svgRef.current, setSelNode);
  }, [tree]);

  const tracar = () => {
    if (!startArt) return;
    if (workerRef.current) { workerRef.current.terminate(); workerRef.current = null; }
    setLoading(true); setTree(null); setTraced(false); setSelNode(null);
    try {
      const blob    = new Blob([TEIA_WORKER_SCRIPT], { type: "application/javascript" });
      const blobUrl = URL.createObjectURL(blob);
      const worker  = new Worker(blobUrl);
      workerRef.current = worker;
      worker.onmessage = e => {
        URL.revokeObjectURL(blobUrl); workerRef.current = null;
        setTree(e.data.ok ? e.data.tree : null);
        if (!e.data.ok) console.error("Teia worker erro:", e.data.error);
        setTraced(true); setLoading(false);
      };
      worker.onerror = err => {
        URL.revokeObjectURL(blobUrl); workerRef.current = null;
        console.error("Teia worker falhou:", err);
        setTree(null); setTraced(true); setLoading(false);
      };
      worker.postMessage({ ds, startId: startArt });
    } catch (e) {
      console.warn("Web Worker indisponível, usando main thread:", e);
      setTimeout(() => {
        try { setTree(buildRecursiveTree(startArt)); } catch (ex) { console.error(ex); setTree(null); }
        setTraced(true); setLoading(false);
      }, 50);
    }
  };

  const countNodes = nd => !nd ? 0 : 1 + (nd.children||[]).reduce((s,c)=>s+countNodes(c),0);
  const totalNodes = tree ? countNodes(tree) : 0;

  return <div style={{display:"flex",gap:16,height:"70vh"}}>

    {/* ── Painel esquerdo ── */}
    <div style={{width:240,display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
      <div style={{fontSize:13,fontWeight:700,color:"var(--gold)"}}>TRAÇAR TEIA</div>
      <select value={startArt} onChange={e=>setStartArt(e.target.value)}
        style={{padding:"8px",borderRadius:6,fontSize:13}}>
        <option value="">Selecione o Artigo...</option>
        {arts.map(a=><option key={a} value={a}>{a}</option>)}
      </select>
      <button onClick={tracar} disabled={loading||!startArt}
        style={{padding:"10px",background:loading?"var(--bg-hover)":"var(--grad)",
                color:loading?"var(--text-sec)":"#fff",border:"none",borderRadius:7,
                fontWeight:600,cursor:loading?"not-allowed":"pointer",
                display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
        {loading?<><Sp/> Processando...</>:"Traçar Teia"}
      </button>

      {traced && tree && <div style={{fontSize:11,color:"var(--text-sec)",lineHeight:1.7,
          padding:"8px 10px",background:"var(--bg-hover)",borderRadius:6}}>
        <div style={{fontWeight:600,marginBottom:4}}>Estatísticas:</div>
        <div>{totalNodes} nó(s) na árvore</div>
        <div>{tree.externalRefs?.length||0} ref(s) externa(s) na raiz</div>
      </div>}

      {/* Legenda e controles */}
      <div style={{fontSize:11,color:"var(--text-sec)",lineHeight:1.7,
          padding:"8px 10px",background:"var(--bg-hover)",borderRadius:6}}>
        <div style={{fontWeight:600,marginBottom:4}}>Controles:</div>
        <div>🖱 <b>Scroll</b> — zoom</div>
        <div>✋ <b>Drag</b> — mover canvas</div>
        <div>👆 <b>Clique</b> — expandir/recolher nó e ver detalhes</div>
        <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid var(--border)"}}>
          <div style={{fontWeight:600,marginBottom:3}}>Legenda:</div>
          {[
            ["var(--gold)",        "Vigente (folha)"],
            ["var(--gold-bright)", "Com filhos recolhidos"],
            ["#e74c3c",            "Revogado"],
            ["#3498db",            "Tem refs. externas"],
          ].map(([bg,lb])=>(
            <div key={lb} style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <span style={{flexShrink:0,display:"inline-block",width:10,height:10,
                            borderRadius:"50%",background:bg}}/>
              <span>{lb}</span>
            </div>
          ))}
        </div>
      </div>
    </div>

    {/* ── Painel direito: canvas D3 ── */}
    <div style={{flex:1,overflow:"hidden",position:"relative",
                 background:"var(--bg-hover)",borderRadius:12,
                 border:"1px solid var(--border)"}}>

      {loading
        ? <div style={{textAlign:"center",paddingTop:100,color:"var(--text-sec)"}}>
            <Sp/><div style={{marginTop:10}}>Processando teia de remissões…</div>
          </div>

          </div>
        : !tree
        ? <div style={{textAlign:"center",paddingTop:100}}>
            Artigo não encontrado ou sem dispositivo vigente.
          </div>
        : <>
            <svg ref={svgRef} style={{width:"100%",height:"100%",display:"block"}}/>

            {/* ── Painel de detalhes do nó selecionado ── */}
            {selNode && <div style={{
                position:"absolute",bottom:12,right:12,width:330,
                background:"var(--bg-card)",border:"1px solid var(--gold)",
                borderRadius:10,padding:14,
                boxShadow:"0 6px 24px rgba(0,0,0,0.25)",

  </div>;
}

function TabIndice({ds,area,onGoToArt}){
  const [filtro,setFiltro]=useState("");
  const [expandedIdx,setExpandedIdx]=useState(null);
  const idxPredefinido=useMemo(()=>buildIdx(ds,area),[ds,area]);
  const resultadosBusca=useMemo(()=>fullTextSearch(ds,filtro),[ds,filtro]);
  const totalOcorrencias=useMemo(()=>resultadosBusca.reduce((s,r)=>s+r.ocorrencias,0),[resultadosBusca]);
  const buscaAtiva=filtro.trim().length>=3;
  const ctx=useMemo(()=>hierarquia(ds),[ds]);
  const highlightText=(text,term)=>{
    if(!term||term.length<3||!text)return text;
    const re=new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi");
    const parts=text.split(re);
    return parts.map((p,i)=>re.test(p)?React.createElement("mark",{key:i,style:{background:"rgba(212,168,83,0.35)",padding:"0 1px",borderRadius:2}},p):p);
  };
  const getArtigoDisps=(artId)=>{
    const result=[];let inside=false;
    for(const d of ds){
      if(d.tipo==="ARTIGO"&&d.id===artId){inside=true;result.push(d);continue;}
      if(inside){if(d.tipo==="ARTIGO"||DIV.has(d.tipo))break;result.push(d);}
    }
    return result;
  };
  return <div>
    <div style={{marginBottom:12}}>
      <input value={filtro} onChange={e=>{setFiltro(e.target.value);setExpandedIdx(null);}} placeholder="Buscar qualquer palavra (mínimo 3 caracteres)..." style={{width:"100%",maxWidth:"100%",background:"var(--bg-hover)",border:"1px solid var(--border)",borderRadius:6,padding:"10px 14px",fontSize:14,boxSizing:"border-box"}}/>
      {buscaAtiva&&<div style={{marginTop:6,fontSize:12,color:"var(--text-sec)"}}>{totalOcorrencias} ocorrência(s) em {resultadosBusca.length} dispositivo(s)</div>}
    </div>
    {buscaAtiva?
      (resultadosBusca.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}>Nenhum dispositivo encontrado para "{filtro}"</div>
      :<div style={{maxHeight:"65vh",overflow:"auto",border:"1px solid var(--border)",borderRadius:8}}>
        <table className="dt"><thead><tr><th style={{width:60}}>#</th><th style={{width:80}}>Tipo</th><th style={{width:100}}>Id</th><th style={{width:80}}>Artigo</th><th>Texto</th><th style={{width:40}}>Qtd</th></tr></thead>
        <tbody>{resultadosBusca.map((r,i)=><React.Fragment key={i}>
          <tr style={{opacity:r.status==="vetado"||r.status==="revogado"?0.5:1,cursor:"pointer",background:expandedIdx===i?"var(--gold-subtle)":"inherit"}} onClick={()=>setExpandedIdx(expandedIdx===i?null:i)}>
            <td>{i+1}</td><td><span className="badge" style={{background:"var(--gold-subtle)",color:"var(--gold)"}}>{r.tipo}</span></td><td style={{fontSize:12,fontWeight:600}}>{r.id}</td><td style={{color:"var(--gold)",fontWeight:600}}>{r.art}</td><td style={{fontSize:12,lineHeight:1.5}}>{highlightText((r.txt||"").slice(0,300)+(r.txt?.length>300?"...":""),filtro)}</td><td style={{fontWeight:700,textAlign:"center",color:"var(--gold)"}}>{r.ocorrencias}</td>
          </tr>
          {expandedIdx===i&&<tr><td colSpan={6} style={{padding:0}}>
            <div style={{padding:"12px 16px",background:"var(--bg-hover)",borderLeft:"3px solid var(--gold)"}}>
              {ctx[r.art]&&<div style={{fontSize:11,color:"var(--text-sec)",marginBottom:8,fontStyle:"italic"}}>{ctx[r.art]}</div>}
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {getArtigoDisps(r.art||r.id).map((d,j)=>{
                  const isMatch=(d.txt||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(filtro.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""));
                  return <div key={j} style={{padding:"4px 8px",borderRadius:4,background:isMatch?"rgba(212,168,83,0.1)":"transparent",fontSize:12,lineHeight:1.6}}>
                    <span style={{color:"var(--gold)",fontWeight:600,marginRight:6}}>{d.id}</span>
                    {highlightText(d.txt||"",filtro)}
                    {d.status==="vetado"&&<span className="badge badge-revogado" style={{marginLeft:6}}>VETADO</span>}
                    {d.status==="revogado"&&<span className="badge badge-revogado" style={{marginLeft:6}}>REVOGADO</span>}
                  </div>;
                })}
              </div>
              <button onClick={(e)=>{e.stopPropagation();onGoToArt(r.art||r.id);}} style={{marginTop:8,padding:"4px 12px",background:"var(--grad)",color:"#fff",border:"none",borderRadius:5,fontSize:11,cursor:"pointer",fontWeight:600}}>Ir para Texto Integral →</button>
            </div>
          </td></tr>}
        </React.Fragment>)}</tbody></table>
      </div>)
    :<div>
      <div style={{fontSize:12,color:"var(--text-sec)",marginBottom:10}}>Palavras-chave do índice ({AREAS[area]?.nome}):</div>
      {Object.keys(idxPredefinido).length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}>Nenhuma palavra-chave encontrada no índice predefinido</div>
      :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>{Object.entries(idxPredefinido).map(([palavra,artigos])=>
        <div key={palavra} className="cd" style={{padding:12,cursor:"pointer"}} onClick={()=>{setFiltro(palavra);}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>{palavra}</div>
          <div style={{fontSize:11,color:"var(--text-sec)"}}>{artigos.length} artigo(s): {artigos.slice(0,3).join(", ")}{artigos.length>3?"...":""}</div>
        </div>
      )}</div>}
    </div>}
  </div>;
}

// ALTERAÇÃO ENTREGA 2: TabMapa com sub-camadas sempre recolhidas ao expandir
function TabMapa({ds}){
  const [selArt,setSelArt]=useState(null);
  // ESTRUTURA: construída ANTES do collapsed para inicialização correta
  const estrutura=useMemo(()=>{
    const mapa=[];
    const stack={PARTE:null,LIVRO:null,"TÍTULO":null,"CAPÍTULO":null,"SEÇÃO":null,"SUBSEÇÃO":null};
    const levels=["PARTE","LIVRO","TÍTULO","CAPÍTULO","SEÇÃO","SUBSEÇÃO"];
    const clearBelow=(tipo)=>{
      const idx=levels.indexOf(tipo);
      for(let i=idx+1;i<levels.length;i++)stack[levels[i]]=null;
    };
    const getParent=(tipo)=>{
      const idx=levels.indexOf(tipo);
      for(let i=idx-1;i>=0;i--){if(stack[levels[i]])return stack[levels[i]];}
      return null;
    };
    for(const d of ds){
      if(DIV.has(d.tipo)){
        const node={tipo:d.tipo,id:d.id,rub:d.rub,children:[],artigos:[]};
        clearBelow(d.tipo);
        stack[d.tipo]=node;
        const parent=getParent(d.tipo);
        if(parent){parent.children.push(node);}
        else{mapa.push(node);}
      }else if(d.tipo==="ARTIGO"){
        let target=null;
        for(let i=levels.length-1;i>=0;i--){if(stack[levels[i]]){target=stack[levels[i]];break;}}
        const artEntry={id:d.id,status:d.status||"vigente"};
        if(target){target.artigos.push(artEntry);}
      }
    }
    return mapa;
  },[ds]);

  // Helper: gerar todas as keys collapsed a partir da estrutura
  const buildAllCollapsedKeys = useCallback((nodes) => {
    const all={};
    const mark=(ns,prefix)=>{
      ns.forEach((n,i)=>{
        const k=prefix+"-"+n.id;
        const hasContent=(n.children&&n.children.length>0)||(n.artigos&&n.artigos.length>0);
        if(hasContent)all[k]=true;
        if(n.children)mark(n.children,k+"-"+i);
      });
    };
    mark(nodes,"root");
    return all;
  }, []);

  // Collapsed: iniciar TUDO recolhido, recalcular quando estrutura mudar
  // allKeysRef mantém TODAS as chaves possíveis da estrutura para uso no toggle,
  // independente do estado atual do collapsed (evita bug de descendants não-inicializados).
  const allKeysRef = useRef({});
  const [collapsed,setCollapsed]=useState({});
  const estruturaRef=useRef(null);
  if(estrutura!==estruturaRef.current){
    estruturaRef.current=estrutura;
    const allKeys=buildAllCollapsedKeys(estrutura);
    allKeysRef.current=allKeys;
    if(Object.keys(allKeys).length>0){
      if(Object.keys(collapsed).length===0||!Object.values(collapsed).some(v=>v===true)){
        setTimeout(()=>setCollapsed(allKeys),0);
      }
    }
  }

  const toggle=(key)=>{
    setCollapsed(p=>{
      const isCurrentlyCollapsed=p[key];
      const newState={...p,[key]:isCurrentlyCollapsed?false:true};
      // Usa allKeysRef (não Object.keys(p)) para garantir que todos os descendants
      // sejam recolhidos, mesmo antes do primeiro setTimeout ter disparado.
      Object.keys(allKeysRef.current).forEach(k=>{
        if(k.startsWith(key+"-")) newState[k]=true;
      });
      return newState;
    });
  };

  const artStatusMap=useMemo(()=>{
    const m={};
    for(const d of ds){if(d.tipo==="ARTIGO")m[d.id]=d.status||"vigente";}
    return m;
  },[ds]);

  const artDetail=useMemo(()=>{
    if(!selArt)return null;
    const result=[];let inside=false;
    for(const d of ds){
      if(d.tipo==="ARTIGO"&&d.id===selArt){inside=true;result.push(d);continue;}
      if(inside){if(d.tipo==="ARTIGO"||DIV.has(d.tipo))break;result.push(d);}
    }
    return result.length>0?result:null;
  },[ds,selArt]);
  const artPath=useMemo(()=>{
    if(!selArt)return"";
    const ctx=hierarquia(ds);
    return ctx[selArt]||"";
  },[ds,selArt]);

  const renderArtigos=(artigos,pathKey)=>{
    if(!artigos||artigos.length===0)return null;
    return <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:4,marginLeft:4}}>
      {artigos.map((a,i)=>{
        const isRev=a.status==="revogado";const isVet=a.status==="vetado";const isInativo=isRev||isVet;const isSel=selArt===a.id;
        return <span key={pathKey+"-"+i}
          onClick={(e)=>{e.stopPropagation();setSelArt(a.id);}}
          style={{background:isSel?"var(--gold)":isInativo?"rgba(231,76,60,0.15)":"var(--gold-subtle)",color:isSel?"#fff":isInativo?"#e74c3c":"var(--gold)",padding:"2px 7px",borderRadius:4,fontSize:11,cursor:"pointer",textDecoration:isInativo?"line-through":"none",fontWeight:isSel?700:400,transition:"all .12s",border:isSel?"1px solid var(--gold)":"1px solid transparent"}}
          title={isRev?"Revogado":isVet?"Vetado":"Vigente"}
        >{a.id}</span>;
      })}
    </div>;
  };

  const renderNode=(node,depth,pathKey)=>{
    const key=pathKey+"-"+node.id;
    const isOpen=!collapsed[key];
    const hasContent=(node.children&&node.children.length>0)||(node.artigos&&node.artigos.length>0);
    const levelStyle={
      "PARTE":{bg:"var(--grad)",color:"#fff",fontWeight:700,fontSize:14,borderRadius:8,padding:"10px 14px"},
      "LIVRO":{bg:"var(--gold)",color:"#fff",fontWeight:700,fontSize:13,borderRadius:7,padding:"8px 12px"},
      "TÍTULO":{bg:"var(--gold-subtle)",color:"var(--gold)",fontWeight:600,fontSize:13,borderRadius:6,padding:"7px 12px"},
      "CAPÍTULO":{bg:"var(--bg-hover)",color:"var(--text)",fontWeight:600,fontSize:12,borderRadius:6,padding:"6px 10px"},
      "SEÇÃO":{bg:"transparent",color:"var(--text-sec)",fontWeight:500,fontSize:12,borderRadius:4,padding:"4px 10px"},
      "SUBSEÇÃO":{bg:"transparent",color:"var(--text-mute)",fontWeight:400,fontSize:11,borderRadius:4,padding:"4px 10px"}
    };
    const st=levelStyle[node.tipo]||levelStyle["SEÇÃO"];
    const indent=depth*12;
    return <div key={key} style={{marginLeft:indent,marginTop:depth===0?8:4}}>
      <div onClick={()=>{if(hasContent)toggle(key);}}
        style={{background:st.bg,color:st.color,fontWeight:st.fontWeight,fontSize:st.fontSize,borderRadius:st.borderRadius,padding:st.padding,cursor:hasContent?"pointer":"default",display:"flex",alignItems:"center",gap:6,border:node.tipo==="CAPÍTULO"||node.tipo==="SEÇÃO"?"1px solid var(--border)":"none",transition:"opacity .12s",userSelect:"none"}}>
        {hasContent&&<span style={{fontSize:10,opacity:.7,flexShrink:0,transition:"transform .15s",transform:isOpen?"rotate(90deg)":"rotate(0deg)"}}>▶</span>}
        <span style={{fontFamily:"'Segoe UI',sans-serif"}}>{node.tipo} — </span>
        <b>{node.id}</b>
        {node.rub&&<span style={{opacity:.8,marginLeft:4}}>— {node.rub}</span>}
        {node.artigos&&node.artigos.length>0&&<span style={{marginLeft:"auto",fontSize:10,opacity:.6,flexShrink:0}}>{node.artigos.length} art.</span>}
      </div>
      {isOpen&&<div>
        {renderArtigos(node.artigos,key)}
        {node.children&&node.children.map((child,i)=>renderNode(child,depth+1,key+"-"+i))}
      </div>}
    </div>;
  };

  return <div style={{display:"flex",gap:16,height:"70vh"}}>
    <div style={{flex:"1 1 55%",overflow:"auto",paddingRight:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--gold)"}}>ESTRUTURA HIERÁRQUICA</div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setCollapsed({})} style={{fontSize:11,padding:"3px 8px",background:"var(--bg-hover)",border:"1px solid var(--border)",borderRadius:4,cursor:"pointer",color:"var(--text-sec)"}}>Expandir tudo</button>
          <button onClick={()=>{
            const all={};
            const markAll=(nodes,prefix)=>{
              nodes.forEach((n,i)=>{
                const k=prefix+"-"+n.id;
                const hasContent=(n.children&&n.children.length>0)||(n.artigos&&n.artigos.length>0);
                if(hasContent)all[k]=true;
                if(n.children)markAll(n.children,k+"-"+i);
              });
            };
            markAll(estrutura,"root");
            setCollapsed(all);
          }} style={{fontSize:11,padding:"3px 8px",background:"var(--bg-hover)",border:"1px solid var(--border)",borderRadius:4,cursor:"pointer",color:"var(--text-sec)"}}>Colapsar tudo</button>
        </div>
      </div>
      <div style={{fontSize:11,color:"var(--text-mute)",marginBottom:6,display:"flex",gap:12}}>
        <span>● <span style={{color:"var(--gold)"}}>Vigente</span></span>
        <span>● <span style={{color:"#e74c3c"}}>Revogado/Vetado</span></span>
        <span style={{marginLeft:"auto",fontStyle:"italic"}}>Clique no artigo para ver o conteúdo →</span>
      </div>
      {estrutura.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}>Nenhuma estrutura hierárquica encontrada</div>
      :estrutura.map((node,i)=>renderNode(node,0,"root"))}
    </div>
    <div style={{flex:"0 0 40%",minWidth:300,overflow:"auto",background:"var(--bg-hover)",borderRadius:12,border:"1px solid var(--border)",padding:16}}>
      {!selArt?<div style={{textAlign:"center",paddingTop:80,color:"var(--text-sec)"}}><div style={{fontSize:28,marginBottom:12}}>📑</div><div style={{fontSize:14}}>Selecione um artigo no mapa para visualizar seu conteúdo.</div></div>
      :!artDetail?<div style={{textAlign:"center",paddingTop:80,color:"var(--text-sec)"}}>Artigo não encontrado nos dispositivos.</div>
      :<div className="fade">
        {artPath&&<div style={{fontSize:11,color:"var(--text-sec)",marginBottom:8,fontStyle:"italic",lineHeight:1.5}}>{artPath}</div>}
        {artDetail.map((d,i)=>{
          const isArt=d.tipo==="ARTIGO";const isRev=d.status==="revogado";const isVet=d.status==="vetado";const isInativo=isRev||isVet;
          return <div key={i} style={{marginBottom:isArt?8:2,paddingLeft:isArt?0:16,opacity:isInativo?0.6:1}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <span style={{color:isInativo?"#e74c3c":"var(--gold)",fontWeight:700,fontSize:isArt?14:12}}>{d.id}</span>
              {isArt&&<span className={isInativo?"badge badge-revogado":"badge badge-vigente"}>{isVet?"VETADO":isRev?"REVOGADO":"VIGENTE"}</span>}
              {!isArt&&isInativo&&<span className="badge badge-revogado" style={{fontSize:9}}>{isVet?"VETADO":"REVOGADO"}</span>}
            </div>
            <div style={{fontSize:isArt?13:12,lineHeight:1.6,textDecoration:isInativo?"line-through":"none",color:"var(--text)"}}>{d.rub&&<i style={{color:"var(--text-sec)"}}>{d.rub} </i>}{d.txt}</div>
            {d.alteracao&&<div style={{marginTop:2,padding:"2px 8px",background:"rgba(52,152,219,0.08)",borderLeft:"2px solid #3498db",borderRadius:3,fontSize:11,color:"#3498db",textDecoration:"none"}}>↳ {d.alteracao}</div>}
          </div>;
        })}
      </div>}
    </div>
  </div>;
}

  const upAnx=async e=>{const files=e.target.files;if(!files||!files.length)return;setUp(true);for(let i=0;i<files.length;i++){await addAnexo(lei.id,files[i]);}setUp(false);if(fRef.current)fRef.current.value="";};

        {uping?<><Sp/> Processando...</>:<><Ic d={IC.up} s={13} c="#fff"/> Adicionar Anexo(s)</>}
        <input ref={fRef} type="file" accept=".pdf" multiple onChange={upAnx} style={{display:"none"}}/>
      </label>

    {anexos.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}>Nenhum anexo vinculado</div>
    :<div style={{display:"flex",gap:16}}>
      <div style={{minWidth:220,display:"flex",flexDirection:"column",gap:4}}>
        {anexos.map((a,i)=><div key={i} className="cd" style={{padding:"10px 12px",cursor:"pointer",borderColor:selAnx===i?"#B8965A":"#E8DFD0",background:selAnx===i?"#F5EDDF":"#fff"}} onClick={()=>setSelAnx(i)}>
          <div style={{fontWeight:600,fontSize:13}}>{a.nome}</div>
          <div style={{fontSize:11,color:"var(--text-sec)",marginTop:2}}>{a.nD} itens</div>
        </div>)}
      </div>
      {selAnx!==null&&anexos[selAnx]&&<div style={{flex:1,maxHeight:"65vh",overflow:"auto",border:"1px solid var(--border)",borderRadius:8}}>
        <table className="dt"><thead><tr><th>#</th><th>Tipo</th><th>Id</th><th>Texto</th></tr></thead><tbody>{anexos[selAnx].ds.map((d,i)=>
          <tr key={i}><td>{i+1}</td><td>{d.tipo}</td><td>{d.id}</td><td>{d.txt}</td></tr>
        )}</tbody></table>

    </div>}
  </div>;
}

// ALTERAÇÃO ENTREGA 2: "Sabatina" → "Perguntas e Respostas", "Corrigir com IA" → "Verificar Respostas"
function TabSabatina({lei,area}){
  const [perguntas,setPerguntas]=useState(()=>LS("t3-sab-"+lei.id)||[]);
  const [respostas,setRespostas]=useState(()=>LS("t3-sab-r-"+lei.id)||{});
  const [correcoes,setCorrecoes]=useState(()=>LS("t3-sab-c-"+lei.id)||{});
  const [loading,setLoading]=useState({});
  const [uploading,setUploading]=useState(false);
  const fRef=useRef(null);
  const salvarRespostas=(novas)=>{setRespostas(novas);LS("t3-sab-r-"+lei.id,novas);};
  const salvarCorrecoes=(novas)=>{setCorrecoes(novas);LS("t3-sab-c-"+lei.id,novas);};
  const uploadDocx=async(e)=>{
    const f=e.target.files?.[0];if(!f)return;
    setUploading(true);
    try{
      const ab=await f.arrayBuffer();
      const qs=[];

      // Tentativa 1: HTML via mammoth — captura listas automáticas do Word (<li>)
      // Cobre o caso mais comum: numeração automática Word sem prefixo explícito no texto
      try{
        const htmlResult=await mammoth.convertToHtml({arrayBuffer:ab});
        const html=htmlResult.value||"";
        const liMatches=html.match(/<li[^>]*>([\s\S]*?)<\/li>/gi)||[];
        for(const li of liMatches){
          const txt=li
            .replace(/<[^>]+>/g,"")
            .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
            .replace(/&nbsp;/g," ").replace(/&#\d+;/g,"").trim();
          if(txt.length>10) qs.push(txt);
        }
      }catch(_){}

      // Tentativa 2: texto puro com numeração explícita ("1. Pergunta" ou "1) Pergunta")
      // Mantém compatibilidade com o formato original esperado pelo sistema
      if(qs.length===0){
        const result=await mammoth.extractRawText({arrayBuffer:ab});
        const text=result.value||"";
        const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
        let current="";
        for(const line of lines){
          const match=line.match(/^(\d+)\s*[\.\)\-]\s*(.+)/);
          if(match){if(current)qs.push(current);current=match[2].trim();}
          else if(current){current+=" "+line;}
        }
        if(current)qs.push(current);
      }

      if(qs.length>0){
        setPerguntas(qs);LS("t3-sab-"+lei.id,qs);
        setRespostas({});LS("t3-sab-r-"+lei.id,{});
        setCorrecoes({});LS("t3-sab-c-"+lei.id,{});
      }else{
        alert("Não foram encontradas perguntas no documento.\n\nFormatos aceitos:\n• Lista automática do Word (numeração via Word)\n• Numeração explícita: 1. Pergunta\n2. Pergunta...");
      }
    }catch(e){alert("Erro ao processar .docx: "+e.message);}
    setUploading(false);
    if(fRef.current)fRef.current.value="";
  };
  const corrigir=async(idx)=>{
    if(!_authToken){alert("Sessão expirada. Faça login novamente.");return;}
    const pergunta=perguntas[idx];
    const resposta=respostas[idx]||"";
    if(!resposta.trim()){alert("Escreva sua resposta antes de solicitar a verificação.");return;}
    setLoading(p=>({...p,[idx]:true}));
    try{
      const termos=pergunta.toLowerCase().split(/\s+/).filter(t=>t.length>3);
      const artigosRelevantes=lei.ds.filter(d=>{
        if(d.status==="vetado")return false;
        const txt=((d.txt||"")+" "+(d.id||"")+" "+(d.rub||"")).toLowerCase();
        return termos.some(t=>txt.includes(t));
      }).slice(0,30).map(d=>`[${d.tipo} ${d.id}] ${d.txt}`).join("\n");
      const systemPrompt=`Você é um professor jurídico tributário especialista em ${AREAS[area]?.nome}, atuando como examinador oral rigoroso mas justo.
Sua função é corrigir a resposta do aluno com base EXCLUSIVAMENTE na lei "${lei.nome}".

CONTEXTO DA LEI (dispositivos relevantes):
${artigosRelevantes || "(Nenhum dispositivo relevante encontrado — use seu conhecimento da lei)"}

REGRAS DE CORREÇÃO:
1. Analise se a resposta está CORRETA, PARCIALMENTE CORRETA ou INCORRETA
2. Aponte o que está certo e o que precisa ser melhorado
3. SEMPRE cite a base legal específica (artigo, parágrafo, inciso) da lei "${lei.nome}"
4. Se a resposta estiver incompleta, indique o que faltou com a referência legal
5. Seja técnico mas didático — como um professor em banca de exame oral
6. Responda em português brasileiro`;
      const r=await callAI({model:"claude-sonnet-4-20250514",max_tokens:2048,system:systemPrompt,messages:[{role:"user",content:`PERGUNTA DA SABATINA:\n${pergunta}\n\nRESPOSTA DO ALUNO:\n${resposta}\n\nCorrija a resposta acima com base legal específica na lei "${lei.nome}".`}]});
      const d=await r.json();
      const texto=d.content?.[0]?.text||"Erro na verificação.";
      const novas={...correcoes,[idx]:texto};
      salvarCorrecoes(novas);
    }catch(e){
      const novas={...correcoes,[idx]:"Erro: "+e.message};
      salvarCorrecoes(novas);
    }
    setLoading(p=>({...p,[idx]:false}));
  };
  const limparTudo=()=>{if(confirm("Limpar todas as perguntas, respostas e verificações?")){
    setPerguntas([]);setRespostas({});setCorrecoes({});
    LS("t3-sab-"+lei.id,null);LS("t3-sab-r-"+lei.id,null);LS("t3-sab-c-"+lei.id,null);
  }};

  const exportDocx=()=>{
    try{
      // Construir HTML formatado compatível com Word
      let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
<style>
  body { font-family: Calibri, sans-serif; font-size: 11pt; color: #1a1a1a; margin: 2cm; }
  .titulo { font-size: 14pt; font-weight: bold; color: #1a365d; text-align: center; margin-bottom: 20pt; }
  .subtitulo { font-size: 10pt; color: #666; text-align: center; margin-bottom: 30pt; }
  .pergunta { font-size: 11pt; font-weight: bold; color: #1a1a1a; margin-top: 18pt; margin-bottom: 6pt; }
  .numero { color: #B8965A; font-weight: bold; }
  .resposta-label { font-size: 10pt; font-weight: bold; color: #2e86ab; margin-top: 8pt; margin-bottom: 4pt; }
  .resposta { font-size: 11pt; color: #333; margin-bottom: 4pt; padding-left: 12pt; border-left: 3px solid #B8965A; line-height: 1.6; }
  .sem-resposta { font-size: 10pt; color: #999; font-style: italic; margin-bottom: 4pt; padding-left: 12pt; }
  .separador { border: none; border-top: 1px solid #e0dcd4; margin: 14pt 0; }
</style></head><body>`;

      html += `<div class="titulo">Perguntas e Respostas</div>`;
      html += `<div class="subtitulo">${lei.nome} — Exportado em ${new Date().toLocaleDateString("pt-BR")}</div>`;

      for(let i=0;i<perguntas.length;i++){
        const resp = (respostas[i]||"").trim();
        html += `<div class="pergunta"><span class="numero">${i+1}.</span> ${perguntas[i].replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>`;
        if(resp){
          html += `<div class="resposta-label">Resposta:</div>`;
          html += `<div class="resposta">${resp.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br/>")}</div>`;
        }else{
          html += `<div class="sem-resposta">(Sem resposta)</div>`;
        }
        if(i<perguntas.length-1) html += `<hr class="separador"/>`;
      }

      html += `</body></html>`;

      const blob = new Blob(['\ufeff'+html], {type:'application/msword'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = lei.nome.replace(/[^a-zA-Z0-9À-ü\s\-_]/g,"").trim().slice(0,50) + "_Perguntas_Respostas.doc";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){
      alert("Erro ao exportar: "+e.message);
    }
  };
  if(!_authToken)return <div className="cd" style={{padding:20}}><div style={{color:"var(--err)"}}>Sessão expirada. Recarregue a página e faça login novamente.</div></div>;
  return <div className="fade">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div>
        <h3 style={{margin:0,fontSize:16}}>Perguntas e Respostas — {lei.nome}</h3>
        <div style={{fontSize:12,color:"var(--text-sec)",marginTop:2}}>{perguntas.length} pergunta(s) carregada(s)</div>
      </div>
      <div style={{display:"flex",gap:6}}>
        <label style={{display:"inline-flex",alignItems:"center",gap:5,padding:"7px 14px",background:"var(--grad)",color:"#fff",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600}}>
          {uploading?<><Sp/> Processando...</>:<><Ic d={IC.up} s={13} c="#fff"/> Carregar .docx</>}
          <input ref={fRef} type="file" accept=".docx" onChange={uploadDocx} style={{display:"none"}}/>
        </label>
        {perguntas.length>0&&<button onClick={exportDocx} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"7px 14px",background:"var(--bg-hover)",border:"1px solid var(--border)",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,color:"var(--text)"}}><Ic d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" s={13} c="var(--gold)"/> Exportar .docx</button>}
        {perguntas.length>0&&<button onClick={limparTudo} className="btn-secondary" style={{fontSize:12,padding:"7px 12px",color:"var(--err)"}}>Limpar</button>}
      </div>
    </div>
    {perguntas.length===0?
      <div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}><div style={{fontSize:48,marginBottom:12}}>📝</div><div style={{fontSize:16,marginBottom:8}}>Nenhuma pergunta carregada</div><div style={{fontSize:13,lineHeight:1.6}}>Faça upload de um arquivo .docx com perguntas numeradas.<br/>Formato esperado:<br/><code style={{background:"var(--bg-hover)",padding:"2px 6px",borderRadius:3}}>1. Pergunta um?<br/>2. Pergunta dois?</code></div></div>
    :<div style={{display:"flex",flexDirection:"column",gap:16,maxHeight:"68vh",overflow:"auto",paddingRight:8}}>
      {perguntas.map((p,idx)=><div key={idx} className="cd" style={{padding:16}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:10}}>
          <span style={{background:"var(--grad)",color:"#fff",minWidth:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{idx+1}</span>
          <div style={{fontSize:14,fontWeight:600,lineHeight:1.5,flex:1}}>{p}</div>
        </div>
        <textarea value={respostas[idx]||""} onChange={e=>{const novas={...respostas,[idx]:e.target.value};salvarRespostas(novas);}} placeholder="Escreva sua resposta aqui..." style={{width:"100%",minHeight:100,background:"var(--input-bg)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",fontSize:13,lineHeight:1.6,resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
          <button onClick={()=>corrigir(idx)} disabled={loading[idx]} style={{padding:"8px 16px",background:loading[idx]?"var(--bg-hover)":"var(--grad)",color:loading[idx]?"var(--text-sec)":"#fff",border:"none",borderRadius:6,fontSize:13,fontWeight:600,cursor:loading[idx]?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:6}}>
            {loading[idx]?<><Sp/> Verificando...</>:"✏️ Verificar Respostas"}
          </button>
        </div>
        {correcoes[idx]&&<div style={{marginTop:10,padding:"12px 16px",background:"var(--bg-hover)",borderRadius:8,borderLeft:"3px solid var(--gold)",fontSize:13,lineHeight:1.7,whiteSpace:"pre-wrap"}}>
          <div style={{fontWeight:700,color:"var(--gold)",marginBottom:6,fontSize:12}}>VERIFICAÇÃO DO PROFESSOR IA</div>
          {correcoes[idx]}
        </div>}
      </div>)}
    </div>}
  </div>;
}
