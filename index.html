function EConsultorAnotacoes({lib}){
  const [temas,setTemas]=useState(()=>LS("t3-temas")||[]);
  const [notas,setNotas]=useState(()=>LS("t3-notas")||[]);
  const [temaSel,setTemaSel]=useState("");
  const [leiSel,setLeiSel]=useState("");
  const [texto,setTexto]=useState("");
  const [viewMode,setViewMode]=useState("form"); // "form" | "list"
  const [temaView,setTemaView]=useState(null); // tema selecionado para visualizar notas
  const [editNota,setEditNota]=useState(null); // nota em edição
  const [novoTema,setNovoTema]=useState("");

  const salvarTemas=(t)=>{setTemas(t);LS("t3-temas",t);};
  const salvarNotas=(n)=>{setNotas(n);LS("t3-notas",n);};

  const addTema=()=>{
    const nome=novoTema.trim();
    if(!nome){alert("Digite o nome do tema.");return;}
    if(temas.includes(nome)){alert("Esse tema já existe.");return;}
    salvarTemas([...temas,nome]);
    setNovoTema("");
  };

  const delTema=(tema)=>{
    const notasTema=notas.filter(n=>n.tema===tema);
    if(notasTema.length>0){
      if(!confirm(`O tema "${tema}" possui ${notasTema.length} anotação(ões). Deseja excluir o tema e todas as anotações vinculadas?`))return;
      salvarNotas(notas.filter(n=>n.tema!==tema));
    }
    salvarTemas(temas.filter(t=>t!==tema));
    if(temaView===tema){setTemaView(null);setViewMode("form");}
  };

  const addNota=()=>{
    if(!temaSel){alert("Selecione um tema.");return;}
    if(!texto.trim()){alert("Escreva a anotação.");return;}
    const nova={
      id:Date.now()+"-"+Math.random().toString(36).slice(2,8),
      tema:temaSel,
      lei:leiSel||"",
      leiNome:leiSel?lib.find(l=>l.id===leiSel)?.nome||"":"",
      texto:texto.trim(),
      data:new Date().toLocaleDateString("pt-BR"),
      dataISO:new Date().toISOString()
    };
    salvarNotas([nova,...notas]);
    setTexto("");
  };

  const updateNota=(id,novoTexto)=>{
    salvarNotas(notas.map(n=>n.id===id?{...n,texto:novoTexto,dataEdit:new Date().toLocaleDateString("pt-BR")}:n));
    setEditNota(null);
  };

  const deleteNota=(id)=>{
    if(!confirm("Excluir esta anotação?"))return;
    salvarNotas(notas.filter(n=>n.id!==id));
    setEditNota(null);
  };

  const limparForm=()=>{setTemaSel("");setLeiSel("");setTexto("");};

  const notasDoTema=temaView?notas.filter(n=>n.tema===temaView):[];

  return <div style={{display:"flex",gap:16,height:"68vh"}}>
    {/* PAINEL ESQUERDO: TEMAS */}
    <div style={{width:240,flexShrink:0,display:"flex",flexDirection:"column",border:"2px solid var(--gold)",borderRadius:12,padding:12,overflow:"hidden",minHeight:0}}>
      <div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"var(--gold)"}}>TEMAS</div>
      <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column",gap:4,marginBottom:10,minHeight:0}}>
        {temas.length===0?<div style={{fontSize:12,color:"var(--text-mute)",textAlign:"center",padding:20}}>Nenhum tema cadastrado</div>
        :temas.map((t,i)=><div key={i}
          onClick={()=>{setTemaView(t);setViewMode("list");}}
          style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",borderRadius:6,cursor:"pointer",background:temaView===t?"var(--gold-subtle)":"var(--bg-hover)",border:temaView===t?"1px solid var(--gold)":"1px solid transparent",transition:"all .12s"}}>
          <span style={{fontSize:13,fontWeight:temaView===t?600:400,color:temaView===t?"var(--gold)":"var(--text)"}}>{t}</span>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <span style={{fontSize:10,color:"var(--text-mute)"}}>{notas.filter(n=>n.tema===t).length}</span>
            <button onClick={e=>{e.stopPropagation();delTema(t);}} style={{background:"none",border:"none",cursor:"pointer",padding:2,lineHeight:1}} title="Excluir tema"><Ic d={IC.tr} s={11} c="var(--text-mute)"/></button>
          </div>
        </div>)}
      </div>
      <div style={{display:"flex",gap:4,flexShrink:0}}>
        <input value={novoTema} onChange={e=>setNovoTema(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTema();}} placeholder="Novo tema..." style={{flex:1,padding:"7px 10px",borderRadius:6,fontSize:12}}/>
        <button onClick={addTema} style={{padding:"7px 12px",background:"var(--grad)",color:"#fff",border:"none",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>Incluir</button>
      </div>
    </div>

    {/* PAINEL DIREITO: FORMULÁRIO OU LISTA */}
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {viewMode==="list"&&temaView?<div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div><span style={{fontSize:16,fontWeight:700}}>Anotações — </span><span style={{fontSize:16,fontWeight:700,color:"var(--gold)"}}>{temaView}</span><span style={{fontSize:12,color:"var(--text-sec)",marginLeft:8}}>({notasDoTema.length} anotação(ões))</span></div>
          <button onClick={()=>{setViewMode("form");setTemaView(null);}} style={{padding:"6px 14px",border:"1px solid var(--border)",borderRadius:6,background:"none",cursor:"pointer",fontSize:12,color:"var(--text-sec)"}}>← Voltar</button>
        </div>
        <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column",gap:8}}>
          {notasDoTema.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}>Nenhuma anotação neste tema</div>
          :notasDoTema.map(n=><div key={n.id} className="cd" style={{padding:14}}>
            {editNota===n.id?<div>
              <textarea defaultValue={n.texto} id={"edit-"+n.id} style={{width:"100%",minHeight:80,background:"var(--input-bg)",border:"1px solid var(--border)",borderRadius:6,padding:10,fontSize:13,resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>
              <div style={{display:"flex",gap:6,marginTop:8}}>
                <button onClick={()=>{const el=document.getElementById("edit-"+n.id);if(el)updateNota(n.id,el.value);}} style={{padding:"6px 14px",background:"var(--grad)",color:"#fff",border:"none",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer"}}>Salvar</button>
                <button onClick={()=>setEditNota(null)} style={{padding:"6px 14px",border:"1px solid var(--border)",borderRadius:6,background:"none",cursor:"pointer",fontSize:12,color:"var(--text-sec)"}}>Cancelar</button>
                <button onClick={()=>deleteNota(n.id)} style={{padding:"6px 14px",border:"1px solid #e74c3c",borderRadius:6,background:"none",cursor:"pointer",fontSize:12,color:"#e74c3c",marginLeft:"auto"}}>Excluir</button>
              </div>
            </div>
            :<div onClick={()=>setEditNota(n.id)} style={{cursor:"pointer"}}>
              <div style={{display:"flex",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                <span className="badge" style={{background:"var(--gold-subtle)",color:"var(--gold)"}}>{n.tema}</span>
                {n.leiNome&&<span className="badge" style={{background:"rgba(52,152,219,0.1)",color:"#3498db"}}>{n.leiNome}</span>}
                <span style={{fontSize:10,color:"var(--text-mute)",marginLeft:"auto"}}>{n.data}{n.dataEdit?" (editado "+n.dataEdit+")":""}</span>
              </div>
              <div style={{fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{n.texto}</div>
            </div>}
          </div>)}
        </div>
      </div>
      :<div style={{display:"flex",flexDirection:"column",flex:1}}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:14}}>INCLUIR ANOTAÇÕES</div>
        <div style={{display:"flex",gap:10,marginBottom:12}}>
          <select value={temaSel} onChange={e=>setTemaSel(e.target.value)} style={{flex:1,padding:"10px",borderRadius:6,fontSize:13}}>
            <option value="">Selecionar Tema...</option>
            {temas.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <select value={leiSel} onChange={e=>setLeiSel(e.target.value)} style={{flex:1,padding:"10px",borderRadius:6,fontSize:13}}>
            <option value="">Selecionar Lei (opcional)...</option>
            {lib.map(l=><option key={l.id} value={l.id}>{l.nome}</option>)}
          </select>
        </div>
        <textarea value={texto} onChange={e=>setTexto(e.target.value)} placeholder="Escreva sua anotação aqui..." style={{flex:1,minHeight:200,background:"var(--input-bg)",border:"1px solid var(--border)",borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.6,resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>

function EConsultorBusca({lib}){
  const [notas]=useState(()=>LS("t3-notas")||[]);
  const [temas]=useState(()=>LS("t3-temas")||[]);
  const [filtroTema,setFiltroTema]=useState("");
  const [filtroLei,setFiltroLei]=useState("");
  const [filtroTexto,setFiltroTexto]=useState("");

  // Índice invertido pré-construído para busca otimizada
  const indiceInvertido = useMemo(()=>{
    const idx = new Map(); // Map<trigrama, Set<notaId>>
    for(const n of notas){
      const texto = ((n.tema||"")+" "+(n.leiNome||"")+" "+(n.texto||"")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      // Extrair tokens de 3+ caracteres
      const tokens = texto.match(/\w{3,}/g)||[];
      for(const token of tokens){
        // Gerar substrings de 3 chars para busca parcial
        for(let i=0;i<=token.length-3;i++){
          const tri = token.slice(i,i+3);
          if(!idx.has(tri)) idx.set(tri, new Set());
          idx.get(tri).add(n.id);
        }
      }
    }
    return idx;
  },[notas]);

  const resultados = useMemo(()=>{
    let filtered = [...notas];

    // Filtro por tema
    if(filtroTema) filtered = filtered.filter(n=>n.tema===filtroTema);

    // Filtro por lei
    if(filtroLei) filtered = filtered.filter(n=>n.lei===filtroLei);

    // Filtro por texto (full-text search com índice invertido)
    if(filtroTexto.trim().length>=3){
      const termo = filtroTexto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      // Usar índice invertido para pré-filtrar candidatos
      const tri = termo.slice(0,3);
      const candidatos = indiceInvertido.get(tri);
      if(candidatos){
        const candidatoIds = new Set(candidatos);
        filtered = filtered.filter(n=>{
          if(!candidatoIds.has(n.id)) return false;
          // Verificação completa
          const texto = ((n.tema||"")+" "+(n.leiNome||"")+" "+(n.texto||"")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
          return texto.includes(termo);
        });
      }else{
        filtered=[];
      }
    }

    return filtered;
  },[notas,filtroTema,filtroLei,filtroTexto,indiceInvertido]);

  const highlightText=(text,term)=>{
    if(!term||term.length<3||!text)return text;
    try{
      const re=new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi");
      const parts=text.split(re);
      return parts.map((p,i)=>re.test(p)?React.createElement("mark",{key:i,style:{background:"rgba(212,168,83,0.4)",padding:"0 2px",borderRadius:2}},p):p);
    }catch(e){return text;}
  };

  return <div>
    <div style={{fontSize:16,fontWeight:700,marginBottom:14}}>E-CONSULTA</div>
    <div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap"}}>
      <select value={filtroTema} onChange={e=>setFiltroTema(e.target.value)} style={{flex:"1 1 180px",padding:"10px",borderRadius:6,fontSize:13}}>
        <option value="">Busca por Tema</option>
        {temas.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
      <select value={filtroLei} onChange={e=>setFiltroLei(e.target.value)} style={{flex:"1 1 180px",padding:"10px",borderRadius:6,fontSize:13}}>
        <option value="">Busca por Legislação</option>
        {lib.map(l=><option key={l.id} value={l.id}>{l.nome}</option>)}
      </select>
      <input value={filtroTexto} onChange={e=>setFiltroTexto(e.target.value)} placeholder="Palavra Chave (mín. 3 letras)..." style={{flex:"1 1 200px",padding:"10px",borderRadius:6,fontSize:13,background:"var(--input-bg)",border:"1px solid var(--border)"}}/>
    </div>
    <div style={{fontSize:12,color:"var(--text-sec)",marginBottom:12}}>{resultados.length} anotação(ões) encontrada(s){filtroTexto.length>=3?" para \""+filtroTexto+"\"":""}</div>
    <div style={{maxHeight:"58vh",overflow:"auto",display:"flex",flexDirection:"column",gap:10}}>
      {resultados.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sec)"}}>{notas.length===0?"Nenhuma anotação cadastrada. Use a aba Anotações para incluir.":"Nenhuma anotação encontrada com os filtros aplicados."}</div>
      :resultados.map(n=><div key={n.id} className="cd" style={{padding:14}}>
        <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
          <span className="badge" style={{background:"var(--gold-subtle)",color:"var(--gold)",fontSize:11,padding:"3px 10px"}}>{n.tema}</span>
          {n.leiNome&&<span className="badge" style={{background:"rgba(52,152,219,0.1)",color:"#3498db",fontSize:11,padding:"3px 10px"}}>{n.leiNome}</span>}
          <span style={{fontSize:10,color:"var(--text-mute)",marginLeft:"auto"}}>{n.data}</span>
        </div>
        <div style={{fontSize:13,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{filtroTexto.length>=3?highlightText(n.texto,filtroTexto):n.texto}</div>
      </div>)}
    </div>
  </div>;
}

  const buscar=async()=>{setLd(true);setErro("");setSucesso("");
    try{
      const r=await fetch(DATA_URL+"?t="+Date.now());
      if(!r.ok)throw new Error("Arquivo de atualizações não encontrado ("+r.status+"). Verifique se o workflow do GitHub Actions foi executado e se o arquivo data/atualizacoes.json existe no repositório.");
      const data=await r.json();
      if(data.itens&&Array.isArray(data.itens)){
        if(data.itens.length===0&&itens.length===0){
          setSucesso("Busca concluída — o servidor retornou 0 itens. O script Python pode não estar encontrando publicações nas fontes. Verifique os logs do GitHub Actions.");

  const exportar=()=>{try{

        </div>
        <div style={{fontWeight:600,fontSize:14,marginBottom:4}}>{item.titulo}</div>
        {item.resumo&&<div style={{fontSize:12,color:"var(--text-sec)",lineHeight:1.5}}>{item.resumo}</div>}
      </div>
    )}</div>}
  </div>;
}

// ─── LoginScreen ─────────────────────────────────────────────────────────────
function LoginScreen({onLogin,theme,toggleTheme}){
  const [mode,setMode]=useState("login"); // "login" | "register"
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [inviteCode,setInviteCode]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");

  const submit=async()=>{
    setErr("");
    if(!username.trim()||!password.trim()){setErr("Preencha usuário e senha.");return;}
    if(mode==="register"&&!inviteCode.trim()){setErr("Informe o código de convite.");return;}
    setLoading(true);
    try{
      const body=mode==="login"
        ?{username:username.trim(),password}
        :{username:username.trim(),password,inviteCode:inviteCode.trim()};
      const r=await fetch(`${PROXY}/auth/${mode}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok){setErr(d.error||"Erro desconhecido");setLoading(false);return;}
      onLogin(d.token,d.username,d.userId);
    }catch(e){setErr("Erro de conexão: "+e.message);}
    setLoading(false);
  };

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
    <div style={{position:"absolute",top:16,right:16}}><ThemeBtn theme={theme} toggle={toggleTheme}/></div>
    <div style={{marginBottom:32,textAlign:"center"}}>
      <Logo/>
      <div style={{marginTop:12,fontSize:22,fontWeight:800,letterSpacing:2}}>TERA</div>
      <div style={{fontSize:13,color:"var(--text-sec)",marginTop:4}}>RACIOCÍNIO JURÍDICO</div>
    </div>
    <div className="cd" style={{width:"100%",maxWidth:380,padding:28}}>
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        <button onClick={()=>{setMode("login");setErr("");}} style={{flex:1,padding:"8px 0",borderRadius:6,border:"none",cursor:"pointer",fontWeight:mode==="login"?700:400,background:mode==="login"?"var(--gold-subtle)":"transparent",color:mode==="login"?"var(--gold)":"var(--text-sec)",fontSize:13,fontFamily:"inherit"}}>Entrar</button>
        <button onClick={()=>{setMode("register");setErr("");}} style={{flex:1,padding:"8px 0",borderRadius:6,border:"none",cursor:"pointer",fontWeight:mode==="register"?700:400,background:mode==="register"?"var(--gold-subtle)":"transparent",color:mode==="register"?"var(--gold)":"var(--text-sec)",fontSize:13,fontFamily:"inherit"}}>Criar Conta</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <input value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="Usuário" style={{padding:"10px 12px",borderRadius:7,fontSize:14,outline:"none"}}/>
        <input value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} type="password" placeholder="Senha" style={{padding:"10px 12px",borderRadius:7,fontSize:14,outline:"none"}}/>
        {mode==="register"&&<input value={inviteCode} onChange={e=>setInviteCode(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="Código de convite (ex: A3F2B1C4)" style={{padding:"10px 12px",borderRadius:7,fontSize:14,outline:"none",letterSpacing:2}}/>}
        {err&&<div style={{color:"var(--err)",fontSize:12,padding:"6px 10px",background:"rgba(231,76,60,.1)",borderRadius:5}}>{err}</div>}
        <button onClick={submit} disabled={loading} className="btn-primary" style={{marginTop:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {loading&&<Sp/>}{mode==="login"?"Entrar":"Criar Conta"}
        </button>
      </div>
    </div>
    <div style={{marginTop:16,fontSize:11,color:"var(--text-mute)"}}>Acesso restrito — máx. 5 usuários</div>
  </div>;
}

// ─── ApiKeyModal ──────────────────────────────────────────────────────────────
function ApiKeyModal({status,onSave,onDelete,onClose}){
  const [key,setKey]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");

  const save=async()=>{
    if(!key.trim()){setErr("Digite a chave.");return;}
    if(!key.trim().startsWith("sk-ant-")){setErr("Chave inválida — deve começar com sk-ant-");return;}
    setLoading(true);setErr("");
    try{await onSave(key.trim());}catch(e){setErr(e.message);}
    setLoading(false);
  };

  const remove=async()=>{
    if(!confirm("Remover sua API Key? Sem ela as funções de IA ficarão indisponíveis."))return;
    setLoading(true);
    try{await onDelete();}catch{}
    setLoading(false);
  };

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="cd" style={{width:"100%",maxWidth:420,padding:24}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:15}}>⚙ Minha API Key Anthropic</div>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text-sec)",fontSize:18}}>✕</button>
      </div>
      {status?.configured&&<div style={{marginBottom:12,padding:"8px 12px",background:"rgba(46,204,113,.1)",borderRadius:6,fontSize:12,color:"var(--ok)"}}>✓ Chave configurada: <code>{status.masked}</code></div>}
      <div style={{fontSize:12,color:"var(--text-sec)",marginBottom:10}}>Sua chave fica armazenada no servidor de forma segura e nunca é exposta ao navegador.</div>
      <input value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-api03-…" style={{width:"100%",padding:"10px 12px",borderRadius:7,fontSize:13,outline:"none",marginBottom:10,fontFamily:"monospace"}}/>
      {err&&<div style={{color:"var(--err)",fontSize:12,marginBottom:8}}>{err}</div>}
      <div style={{display:"flex",gap:8}}>
        <button onClick={save} disabled={loading} className="btn-primary" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          {loading&&<Sp/>}Salvar
        </button>
        {status?.configured&&<button onClick={remove} disabled={loading} className="btn-secondary" style={{color:"var(--err)",borderColor:"var(--err)"}}>Remover</button>}
      </div>
    </div>
  </div>;
}

ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>,document.getElementById("root"));
</script>
</body>
</html>
