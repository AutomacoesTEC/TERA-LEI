name: TERA — Curadoria Semanal Tributária

# Executa toda segunda-feira às 07:00 BRT (10:00 UTC)
# Pesca publicações da semana anterior (segunda a domingo)
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      data_inicio:
        description: 'Data início (YYYY-MM-DD). Vazio = segunda passada'
        required: false
        default: ''
      data_fim:
        description: 'Data fim (YYYY-MM-DD). Vazio = último domingo'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  curadoria:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml feedparser certifi
          pip install cloudscraper

      - name: Executar Curadoria Semanal
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DATA_INICIO: ${{ github.event.inputs.data_inicio }}
          DATA_FIM: ${{ github.event.inputs.data_fim }}
        run: |
          python curadoria_semanal.py

      - name: Commit e push do resultado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "TERA Bot"
          git add data/curadoria_semanal.json data/curadoria_semanal_historico.json
          git diff --cached --quiet || git commit -m "📋 Curadoria Semanal $(date +'%d/%m/%Y') — publicações fiscais e jurisprudência"
          git push
