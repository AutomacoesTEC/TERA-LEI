name: TERA — Curadoria Reforma Tributária

on:
  schedule:
    # Executa diariamente às 19:00 BRT (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Permite execução manual

permissions:
  contents: write

jobs:
  curadoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar curadoria da Reforma
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python curador_reforma.py

      - name: Commit e push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "TERA Bot"
          git add data/reforma_em_dia.json logs/
          git diff --cached --quiet || git commit -m "⚖️ Curadoria Reforma $(date +'%d/%m/%Y %H:%M') BRT"
          git push
