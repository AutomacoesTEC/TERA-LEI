name: TERA — Curadoria Reforma v2 (Node.js)

on:
  schedule:
    # 19:00 BRT = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curadoria:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: ./curador-reforma
        run: npm ci || npm install

      - name: Instalar dependências do Puppeteer (Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libasound2 libpangocairo-1.0-0 libatk1.0-0 libcups2 \
            libnspr4 libnss3 libxss1 fonts-liberation xdg-utils

      - name: Executar curadoria
        working-directory: ./curador-reforma
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: America/Sao_Paulo
          PUPPETEER_ARGS: --no-sandbox
        run: node curador-reforma.js

      - name: Integrar com reforma_em_dia.json
        run: |
          # Se o curador encontrou itens, mesclar com data/reforma_em_dia.json
          if [ -f curador-reforma/data/reforma_curadoria.json ]; then
            python3 << 'PYEOF'
          import json, os, re, hashlib
          from datetime import datetime

          curadoria_path = "curador-reforma/data/reforma_curadoria.json"
          reforma_path = "data/reforma_em_dia.json"

          # ── Detecta série + versão de uma nota técnica ──────────────────────
          # Ex.: "Nota Técnica 2025.001 v.1.07" → ("2025.001", (1, 7))
          RE_NT = re.compile(
              r'(?:nota\s+t[eé]cnica|nt)[\s_]*(\d{4}\.\d{3,4})'
              r'.*?v[\.\s]*(\d+)[\.\s]+(\d+)',
              re.IGNORECASE
          )

          def extrair_nt(titulo):
              m = RE_NT.search(titulo or "")
              if not m:
                  return None, None
              serie = m.group(1)
              versao = (int(m.group(2)), int(m.group(3)))
              return serie, versao

          # ── Formata data DD/MM/YYYY → YYYY-MM-DD ────────────────────────────
          def fmt_data(d):
              if not d:
                  return ""
              if "/" in d:
                  parts = d.split("/")
                  if len(parts) == 3:
                      return f"{parts[2]}-{parts[1]}-{parts[0]}"
              return d[:10]

          # ── Carrega curadoria do dia ─────────────────────────────────────────
          with open(curadoria_path, "r", encoding="utf-8") as f:
              curadoria = json.load(f)

          # ── Carrega histórico ────────────────────────────────────────────────
          if os.path.exists(reforma_path):
              with open(reforma_path, "r", encoding="utf-8") as f:
                  historico = json.load(f)
          else:
              historico = {"itens": []}

          # ── Migração: garantir status em itens existentes ────────────────────
          migrados = 0
          for item in historico.get("itens", []):
              if "status" not in item:
                  item["status"] = "vigente"
                  migrados += 1
          if migrados:
              print(f"Migração: {migrados} item(ns) receberam status='vigente'")

          # ── Índice de ids existentes ─────────────────────────────────────────
          ids_existentes = {item.get("id", "") for item in historico.get("itens", [])}
          novos = 0
          superados = 0

          for portal in curadoria.get("portais", []):
              for item in portal.get("itens", []):
                  raw = (item.get("url", "") + "|" + item.get("titulo", "")).strip()
                  item_id = hashlib.sha256(raw.encode()).hexdigest()[:16]

                  if item_id in ids_existentes:
                      continue

                  novo = {
                      "id":         item_id,
                      "data":       fmt_data(item.get("dataPublicacao", "")),
                      "titulo":     item.get("titulo", ""),
                      "categoria":  item.get("tipoConteudo", "Orientação").title(),
                      "tags":       item.get("tags", []),
                      "resumo":     item.get("resumoCurto", ""),
                      "fonte":      item.get("portalOrigem", ""),
                      "link":       item.get("url", ""),
                      "linkLista":  item.get("linkLista", ""),
                      "linkResolvido": item.get("linkResolvido", False),
                      "status":     item.get("status", "vigente"),
                  }

                  # ── Detecção de versões superadas ────────────────────────────
                  serie_nova, versao_nova = extrair_nt(novo["titulo"])
                  if serie_nova and versao_nova:
                      for existente in historico["itens"]:
                          if existente.get("status") == "superada":
                              continue
                          serie_ex, versao_ex = extrair_nt(existente.get("titulo", ""))
                          if serie_ex == serie_nova and versao_ex and versao_ex < versao_nova:
                              existente["status"] = "superada"
                              superados += 1

                  historico["itens"].append(novo)
                  ids_existentes.add(item_id)
                  novos += 1

          # ── Ordenar por data (mais recente primeiro) ─────────────────────────
          historico["itens"].sort(key=lambda x: x.get("data", ""), reverse=True)
          historico["ultima_atualizacao"] = datetime.now().isoformat()

          with open(reforma_path, "w", encoding="utf-8") as f:
              json.dump(historico, f, ensure_ascii=False, indent=2)

          print(f"Integração: {novos} novo(s) · {superados} superado(s) · reforma_em_dia.json atualizado")
          PYEOF
          fi

      - name: Commit e push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "TERA Bot"
          git add data/reforma_em_dia.json curador-reforma/pendente-publicacao/ curador-reforma/logs/ curador-reforma/data/
          git diff --cached --quiet || git commit -m "⚖️ Curadoria Reforma v2 $(date +'%d/%m/%Y %H:%M') BRT"
          git push
